<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vagas">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vagas</title>
<style>
  /* Estilo Apple Saúde: fundo cinzento, cartões brancos, cor só para estados e dados. */
  :root {
    color-scheme: light;
    --bg: #f2f2f7; --side: rgba(246,246,249,.9); --card: #ffffff; --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.08);
    --hover: rgba(0,0,0,.04); --label: #1c1c1e; --label-2: #5f5f64; --label-3: #636368; --sep: rgba(60,60,67,.13);
    --blue: #007aff; --blue-text: #0060c7; --blue-soft: rgba(0,122,255,.1); --green: #1b6e30; --green-soft: rgba(52,199,89,.14); --orange: #a84b00;
    --bar: rgba(242,242,247,.82); --modal: rgba(255,255,255,.97); --seg-on: #ffffff; --current: rgba(0,0,0,.055);
    --avatar-bg: #1c1c1e; --avatar-fg: #ffffff; --chart: rgba(0,122,255,.28); --switch-off: #e9e9eb;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02); --shadow-hover: 0 10px 30px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --r-card: 16px; --r-ctl: 10px;
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #1b1f24; --side: rgba(27,31,36,.92); --card: #252a31; --fill: rgba(150,160,175,.16); --fill-2: rgba(150,160,175,.1);
    --hover: rgba(255,255,255,.05); --label: #eceef1; --label-2: #b4b9c0; --label-3: #9aa0a8; --sep: rgba(150,160,175,.18);
    --blue: #0a84ff; --blue-text: #6cb4ff; --blue-soft: rgba(10,132,255,.18); --green: #30d158; --green-soft: rgba(48,209,88,.16); --orange: #ff9f0a;
    --bar: rgba(27,31,36,.82); --modal: rgba(43,49,57,.98); --seg-on: #4a525d; --current: rgba(255,255,255,.07);
    --avatar-bg: #eceef1; --avatar-fg: #1b1f24; --chart: rgba(10,132,255,.4); --switch-off: #3a414b;
    --shadow: 0 0 0 .5px rgba(255,255,255,.06); --shadow-hover: 0 0 0 .5px rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.5); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--label); -webkit-font-smoothing: antialiased;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; letter-spacing: -.011em; }
  button, input, select, a { font: inherit; color: inherit; letter-spacing: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  a { color: var(--blue-text); }
  svg { flex: none; }
  .tnum { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 32px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip:focus { position: fixed; z-index: 50; top: 12px; left: 12px; width: auto; height: auto; clip: auto; padding: 10px 16px; border-radius: 10px;
                background: var(--blue-text); color: #fff; text-decoration: none; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- barra lateral (computador) ---------- */
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100dvh; }
  .side { position: sticky; top: 0; height: 100dvh; overflow: hidden auto; background: var(--side); border-right: .5px solid var(--sep);
          backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
          padding: 24px 12px 12px; display: flex; flex-direction: column; min-width: 0; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -.025em; padding: 0 10px 22px; }
  .nav { display: grid; gap: 2px; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 8px 10px; border: 0; border-radius: var(--r-ctl);
          background: transparent; text-align: left; cursor: pointer; font-size: 15px; color: var(--label); text-decoration: none;
          transition: background-color 150ms var(--ease-out); }
  .item svg { color: var(--label-2); }
  .item[aria-current=page] { background: var(--current); font-weight: 600; }
  .item[aria-current=page] svg { color: var(--blue); }
  .item .n { margin-left: auto; font-size: 13px; color: var(--label-3); font-weight: 400; }
  .bottom { margin-top: auto; padding-top: 10px; border-top: .5px solid var(--sep); display: flex; align-items: center; gap: 4px; }
  .profile-btn { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px;
                 border-radius: 12px; cursor: pointer; text-align: left; min-height: 52px; transition: background-color 150ms var(--ease-out); }
  .profile-btn .chev { color: var(--label-3); margin-left: auto; }
  .icon-btn { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--label-2);
              display: grid; place-items: center; cursor: pointer; transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out); }
  .icon-btn[aria-current=page] { background: var(--current); color: var(--blue); }
  .avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--avatar-bg); color: var(--avatar-fg);
            font-weight: 600; font-size: 13px; letter-spacing: 0; }
  .pinfo { min-width: 0; }
  .pn { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .ph { font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (hover: hover) and (pointer: fine) {
    .item:hover, .profile-btn:hover, .icon-btn:hover { background: var(--hover); }
    .item[aria-current=page]:hover, .icon-btn[aria-current=page]:hover { background: var(--current); }
  }

  /* ---------- janela de perfis ---------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.24); opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-out); }
  .scrim.open { opacity: 1; pointer-events: auto; transition-duration: 250ms; }
  .modal { position: fixed; z-index: 31; left: 50%; top: 50%; width: min(400px, calc(100vw - 32px)); background: var(--modal);
           backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: 20px; padding: 20px 12px 12px;
           box-shadow: 0 24px 60px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.08); overscroll-behavior: contain;
           opacity: 0; visibility: hidden; transform: translate(-50%, -50%) scale(.96); pointer-events: none;
           transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), visibility 0s linear 200ms; }
  .modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); pointer-events: auto;
                transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out), visibility 0s; }
  .modal h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 0 10px 12px; }
  .plist { display: grid; gap: 4px; }
  .pitem { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; border: 0; background: transparent; padding: 10px; border-radius: 14px;
           text-align: left; cursor: pointer; min-height: 64px; transition: background-color 150ms var(--ease-out); }
  .pitem[aria-current=true] { background: var(--blue-soft); }
  .pitem .avatar { width: 42px; height: 42px; font-size: 15px; }
  .pitem .pinfo { flex: 1; }
  .pitem .tick { color: var(--blue); visibility: hidden; }
  .pitem[aria-current=true] .tick { visibility: visible; }
  @media (hover: hover) and (pointer: fine) { .pitem:hover { background: var(--hover); } .pitem[aria-current=true]:hover { background: var(--blue-soft); } }

  /* ---------- cabeçalho ---------- */
  header.wrap { padding-top: 48px; padding-bottom: 8px; }
  h1 { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
  .sub { color: var(--label-2); font-size: 17px; margin-top: 6px; letter-spacing: -.02em; }
  main.wrap { padding-bottom: 96px; }
  h2.sec { font-size: 22px; font-weight: 700; letter-spacing: -.025em; margin: 36px 0 12px; }
  h2.sec .more { float: right; font-size: 15px; font-weight: 400; letter-spacing: -.01em; }

  /* ---------- dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
  .kpi { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch;
         background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 16px 18px; border: 0; text-align: left; cursor: pointer;
         transition: box-shadow 200ms var(--ease-out), transform 160ms var(--ease-out); }
  .kpi .k-label { font-size: 13px; font-weight: 600; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
  .kpi .k-label svg { color: var(--blue); }
  .kpi .k-value { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 8px; }
  .kpi .k-ctx { font-size: 13px; color: var(--label-2); margin-top: 2px; }
  .panel { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 20px; }
  .kpis + .panel { margin-top: 12px; }
  .chart { display: grid; grid-template-columns: repeat(14, 1fr); align-items: end; gap: 6px; height: 140px; margin-top: 14px; }
  .bar-col { position: relative; height: 100%; display: flex; align-items: flex-end; }
  .bar { width: 100%; min-height: 3px; border-radius: 6px 6px 3px 3px; background: var(--chart); }
  .bar.today { background: var(--blue); }
  .bar-col .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--label-3); margin-top: 8px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .chart-head span { flex: none; white-space: nowrap; }
  .chart-head b { font-size: 17px; font-weight: 600; }
  .chart-head span { font-size: 13px; color: var(--label-2); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; }
  .companies { display: grid; grid-template-columns: minmax(0, 1fr); }
  .panel { min-width: 0; }
  .company-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .company-row + .company-row { border-top: .5px solid var(--sep); }
  .company-row .c-name { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .company-row .c-n { flex: none; min-width: 28px; padding-right: 4px; text-align: right; font-size: 15px; color: var(--label-2); }
  .mini-logo { width: 32px; height: 32px; border-radius: 8px; font-size: 12px; }

  /* ---------- vagas ---------- */
  .bar-sticky { position: sticky; top: 0; z-index: 5; background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
                margin: 0 -32px; padding: 14px 32px 12px; }
  .bar-sticky::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; pointer-events: none;
                       background: linear-gradient(var(--sep), transparent); opacity: 0; transition: opacity 150ms var(--ease-out); }
  .bar-sticky.scrolled::after { opacity: 1; }
  .seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 7px; background: var(--seg-on);
                box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); transition: transform 250ms var(--ease-in-out); }
  .seg button { position: relative; z-index: 1; border: 0; background: transparent; font-size: 14px; font-weight: 500; padding: 6px 18px; cursor: pointer;
                border-radius: 7px; min-width: 0; white-space: nowrap; }
  .seg button[aria-pressed=true] { font-weight: 600; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .search { position: relative; flex: 1 1 200px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--label-3); }
  input[type=search] { width: 100%; padding: 8px 12px 8px 34px; border: 0; border-radius: var(--r-ctl); background: var(--fill); outline: none; font-size: 16px;
                       -webkit-appearance: none; appearance: none; min-height: 38px; }
  input[type=search]::placeholder { color: var(--label-3); }
  input[type=search]:focus { box-shadow: 0 0 0 3px var(--blue-soft); }
  .select { position: relative; }
  .select select { -webkit-appearance: none; appearance: none; border: 0; background: var(--fill); border-radius: var(--r-ctl); padding: 8px 30px 8px 12px;
                   font-size: 15px; cursor: pointer; min-height: 38px; max-width: 220px; text-overflow: ellipsis; }
  .select select.on { background: var(--blue-soft); color: var(--blue-text); font-weight: 500; }
  /* as listas nativas (Windows, Android) não seguem o tema sozinhas: cores explícitas para cada opção */
  select option, select optgroup { background-color: var(--card); color: var(--label); }
  input::placeholder { color: var(--label-2); opacity: 1; }
  input:-webkit-autofill { -webkit-text-fill-color: var(--label); box-shadow: 0 0 0 40px var(--fill) inset; }
  .select svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--label-2); }
  .clear { border: 0; background: transparent; color: var(--blue-text); font-size: 15px; cursor: pointer; padding: 8px 4px; min-height: 38px; }
  .count { font-size: 13px; color: var(--label-2); margin: 16px 2px 10px; }
  .day { font-size: 15px; font-weight: 600; color: var(--label-2); margin: 22px 2px 10px; }
  .list { display: grid; gap: 10px; }
  .job { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 12px 16px 18px;
         background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); transition: box-shadow 200ms var(--ease-out); }
  .job.applied { opacity: .62; }
  .logo { width: 48px; height: 48px; border-radius: 11px; display: grid; place-items: center; background: var(--fill-2); color: var(--label-2);
          font-weight: 700; font-size: 16px; letter-spacing: -.02em; overflow: hidden; box-shadow: inset 0 0 0 .5px var(--sep); }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .jt { min-width: 0; }
  .title-row { display: flex; align-items: baseline; gap: 8px; }
  .title { font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--label); text-decoration: none; letter-spacing: -.02em; }
  .title::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-card); }
  .title:focus-visible { outline: none; }
  .job:has(.title:focus-visible) { box-shadow: 0 0 0 3px var(--blue); }
  .company { font-size: 15px; color: var(--label); margin-top: 2px; }
  .meta { font-size: 13px; color: var(--label-2); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg { color: var(--label-3); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tags span { font-size: 13px; color: var(--label-2); background: var(--fill-2); border-radius: 7px; padding: 3px 9px; }
  .tags .fit { font-weight: 600; }
  .tags .fit.high { background: var(--green-soft); color: var(--green); }
  .tags .fit.good { background: var(--blue-soft); color: var(--blue-text); }
  .warn { font-size: 13px; color: var(--orange); margin-top: 8px; }
  .acts { position: relative; z-index: 2; display: flex; }
  .apply { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--label-3); display: grid; place-items: center; cursor: pointer;
           transition: color 150ms var(--ease-out), background-color 150ms var(--ease-out), transform 160ms var(--ease-out); }
  .apply[aria-pressed=true] { color: var(--green); }
  /* ponto azul de vaga nova, com legenda ao passar ou tocar */
  .logo-wrap { position: relative; width: 48px; height: 48px; }
  .dot { position: absolute; z-index: 3; top: -12px; right: -12px; width: 32px; height: 32px; border: 0; padding: 0; background: transparent;
         display: grid; place-items: center; cursor: default; }
  .dot::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2.5px var(--card); }
  .tip { position: absolute; z-index: 20; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%) scale(.97); transform-origin: bottom center;
         background: var(--label); color: var(--bg); font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 8px; white-space: nowrap;
         opacity: 0; pointer-events: none; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
  .dot .tip { left: 50%; transform: translateX(-50%) scale(.97); transform-origin: bottom center; }
  .dot:focus-visible .tip, .dot.show .tip { opacity: 1; transform: translateX(-50%); }
  .bar-col:hover .tip, .bar-col:focus-visible .tip { opacity: 1; transform: translateX(-50%); }
  .bar-col.start .tip { left: 0; transform: scale(.97); transform-origin: bottom left; }
  .bar-col.end .tip { left: auto; right: 0; transform: scale(.97); transform-origin: bottom right; }
  .bar-col.start:hover .tip, .bar-col.end:hover .tip { transform: none; }
  @media (hover: hover) and (pointer: fine) {
    .dot:hover .tip { opacity: 1; transform: translateX(-50%); transition-delay: 250ms; }
    .job:hover, .kpi:hover { box-shadow: var(--shadow-hover); }
    .apply:hover { background: var(--hover); color: var(--label); }
    .apply[aria-pressed=true]:hover { color: var(--green); }
  }
  .empty { text-align: center; padding: 56px 20px; color: var(--label-2); background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); }
  .empty b { display: block; color: var(--label); font-size: 20px; font-weight: 600; margin-bottom: 6px; letter-spacing: -.02em; }
  .empty button { margin-top: 14px; }

  /* ---------- regras e definições ---------- */
  .group { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; min-height: 56px; }
  .row + .row { border-top: .5px solid var(--sep); }
  .row .rt { flex: 1; min-width: 0; }
  .row .rt b { display: block; font-size: 16px; font-weight: 500; }
  .row .rt span { display: block; font-size: 14px; color: var(--label-2); margin-top: 2px; }
  .row .rv { flex: none; font-size: 16px; color: var(--label-2); text-align: right; }
  .row .rv.strong { color: var(--label); font-weight: 600; }
  .theme-ico { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue-text);
               font-size: 14px; font-weight: 700; }
  .note { font-size: 14px; color: var(--label-2); margin: 10px 4px 0; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--blue-text); color: #fff; border-radius: 999px; padding: 10px 18px;
         font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 44px; transition: transform 160ms var(--ease-out); }
  .btn.ghost { background: var(--fill); color: var(--blue-text); }
  .src-row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 3px 0; }
  .src-row .bad { color: var(--orange); }

  /* ---------- carregar no ecrã: pressão e vibração visual ---------- */
  .kpi:active, .btn:active, .apply:active, .seg button:active, .item:active, .pitem:active, .profile-btn:active, .icon-btn:active { transform: scale(.97); }
  .item, .pitem, .profile-btn, .icon-btn { transition: background-color 150ms var(--ease-out), transform 160ms var(--ease-out); }
  .nope { animation: nope 320ms var(--ease-out); }
  @keyframes nope { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

  /* ---------- entrada (uma vez por sessão) e cartões ao fazer scroll (uma vez) ---------- */
  .js .rise { opacity: 0; transform: translateY(8px); }
  .js .rise.in { opacity: 1; transform: none; transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out); transition-delay: var(--d, 0ms); }
  .js .reveal { opacity: 0; transform: translateY(12px); }
  .js .reveal.in { opacity: 1; transform: none; transition: opacity 450ms var(--ease-out), transform 450ms var(--ease-out); }
  .swap { animation: fade 150ms var(--ease-out); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- telemóvel ---------- */
  .topbar, .tabs { display: none; }
  @media (pointer: coarse) { .seg button, .select select, input[type=search], .clear { min-height: 44px; } }
  @media (max-width: 900px) {
    body { font-size: 17px; }
    .app { display: block; }
    .side { display: none; }
    .wrap { padding: 0 16px; }
    .topbar { display: flex; position: sticky; top: 0; z-index: 10; align-items: center; justify-content: space-between; gap: 12px;

document.documentElement.classList.add("js");

const repoEdit = (() => { const u = location.hostname.split(".")[0], r = location.pathname.split("/")[1];
  return location.hostname.endsWith("github.io") && r ? `https://github.com/${u}/${r}/edit/main/config.yaml` : ""; })();

// ---------- vibração para ações que não são possíveis ----------
// Android: Vibration API. iPhone (iOS 18+): um <input switch> escondido dá um toque háptico ao mudar.

// ---------- tema ----------
const mq = matchMedia("(prefers-color-scheme: dark)");
const theme = () => store.get("vagas-tema", "light");

applyTheme(); (mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme));

// ---------- dados ----------
const SRC = { linkedin: "LinkedIn", indeed: "Indeed", bep: "Emprego público", remotive: "Remoto" };

let profiles = [], current = "", all = [], data = [], updated = "", tracker = {};

const markKey = pid => "vagas-candidaturas:" + pid, seenKey = pid => "vagas-vistas:" + pid;
const day0 = iso => new Date((iso || updated) + "T00:00:00");

const profile = () => profiles.find(x => x.id === current) || {};

function viewFor(pid) {
  const first = profiles[0] && profiles[0].id;
  return all.filter(m => m.profiles ? pid in m.profiles : pid === first).map(m => {
    const pp = (m.profiles || {})[pid] || {};

}
const isNew = m => m.first_seen === updated;
const applied = m => !!marks[m.url];
let seen = {};

// ---------- entrada (uma vez por sessão) e scroll (uma vez por cartão) ----------
let io = null;
function enter(nodes, key) {
  if (session.get("entrada:" + key)) return;
  session.set("entrada:" + key);
  const delays = [0, 50, 90, 120, 150, 175, 200, 220];
  nodes.forEach((n, i) => { n.classList.add("rise"); n.style.setProperty("--d", (delays[i] ?? 220) + "ms"); });

}

// ---------- navegação ----------
const PAGES = [
  { id: "home", label: "Início", icon: P.home },
  { id: "jobs", label: "Vagas", icon: P.jobs },

    if (pg.id === "jobs" && newN) b.append(el("span", "n tnum", `${newN} ${newN === 1 ? "nova" : "novas"}`));

// ---------- URL: #perfil/página e filtros em ?query ----------

// ---------- páginas ----------
const header = (title, sub) => { $("h1").textContent = title; $("sub").textContent = sub; };

function renderHome(main) {
  const p = profile(), last = new Date(updated + "T00:00:00");

  const prevN = prevDay ? byDay[prevDay] : 0;

  const vals = days.map(d => byDay[d] || 0), max = Math.max(1, ...vals), tot = vals.reduce((a, b) => a + b, 0);
  const panel = el("section", "panel");
  const head = el("div", "chart-head"); head.append(el("b", null, "Ritmo dos últimos 14 dias"), el("span", "tnum", plural(tot, "vaga nova", "vagas novas")));

  ch.setAttribute("aria-label", `Vagas novas por dia nos últimos 14 dias: ${days.map((d, i) => `${fmtShort.format(day0(d))}, ${vals[i]}`).join("; ")}`);
  days.forEach((d, i) => { const col = el("div", "bar-col" + (i < 3 ? " start" : i > 10 ? " end" : "")); col.tabIndex = -1;
    const bar = el("div", "bar" + (d === updated ? " today" : "")); bar.style.height = Math.max(2, vals[i] / max * 100) + "%";
    col.append(bar, el("span", "tip", `${fmtShort.format(day0(d))}: ${plural(vals[i], "vaga", "vagas")}`)); ch.append(col); });
  const ax = el("div", "axis"); ax.append(el("span", null, fmtShort.format(day0(days[0]))), el("span", null, "Hoje"));
  panel.append(head, ch, ax);
  main.append(panel);

  // destaques e empresas
  const sec = el("h2", "sec", "Destaques da semana");
  const g = el("div", "grid2");
  const top = data.filter(m => ageDays(m.first_seen) < 7).sort((a, b) => (b.fit ?? b.score * 5) - (a.fit ?? a.score * 5)).slice(0, 3);
  const tl = el("div", "list");
  if (top.length) top.forEach(m => tl.append(card(m))); else { const e = el("div", "empty"); e.append(el("b", null, "Sem destaques esta semana"), document.createTextNode("As melhores vagas da semana aparecem aqui.")); tl.append(e); }
  const cp = el("section", "panel");
  const ch2 = el("div", "chart-head"); ch2.append(el("b", null, "Empresas a contratar"), el("span", null, "30 dias"));
  const comp = {}; data.filter(m => ageDays(m.first_seen) < 30).forEach(m => { const k = (m.company || "").trim(); if (k) (comp[k] = comp[k] || { n: 0, m }).n++; });
  const rows = Object.entries(comp).sort((a, b) => b[1].n - a[1].n).slice(0, 6);
  const cl = el("div", "companies");
  if (!rows.length) cl.append(el("div", "note", "Ainda sem dados."));
  rows.forEach(([name, o]) => { const r = el("div", "company-row"); r.append(logoOf(o.m, "logo mini-logo"), el("span", "c-name", name), el("span", "c-n tnum", o.n)); cl.append(r); });
  cp.append(ch2, cl);
  g.append(tl, cp);
  main.append(sec, g);
  enter([...kp.children, panel, sec, ...tl.children, cp], "home:" + current);
}

function themesIn(rows) { const s = {}; rows.forEach(m => (m.themes || []).forEach(t => s[t] = (s[t] || 0) + 1)); return s; }
function renderJobs(main, opts) {
  const p = profile();
  const base = data.filter(m => filters.v === "novas" ? isNew(m) : ageDays(m.first_seen) < +filters.dias);
  const q = filters.q.trim().toLowerCase();
  const rows = base.filter(m => (!filters.tema || (m.themes || []).includes(filters.tema)) && (!filters.fonte || srcOf(m) === filters.fonte)
    && (!filters.local || placeOf(m) === filters.local) && (!q || [m.title, m.company, m.location].join(" ").toLowerCase().includes(q)));
  header("Vagas", filters.v === "novas" ? `${plural(base.length, "vaga nova", "vagas novas")} para ${p.name || "ti"} na última recolha.` : `Todas as vagas guardadas para ${p.name || "ti"}.`);

  const sticky = el("div", "bar-sticky");
  const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Vista");
  const thumb = el("span", "thumb"); seg.append(thumb);
  const opts2 = [["novas", "Novas"], ["todas", "Todas"]];
  opts2.forEach(([k, lab], i) => { const b = el("button", null, lab); b.type = "button"; b.setAttribute("aria-pressed", filters.v === k);
    b.onclick = () => { if (filters.v === k) return; filters.v = k; writeUrl(); render({ quiet: true }); }; seg.append(b); });
  requestAnimationFrame(() => { const w = (seg.clientWidth - 4) / opts2.length; thumb.style.width = w + "px";
    thumb.style.transform = `translateX(${opts2.findIndex(x => x[0] === filters.v) * w}px)`; });

  const fl = el("div", "filters");
  const sw = el("div", "search"); const inp = el("input"); inp.type = "search"; inp.placeholder = "Pesquisar"; inp.value = filters.q;
  inp.setAttribute("aria-label", "Pesquisar título, empresa ou local"); sw.append(svg(I(P.search, 15)), inp);
  inp.addEventListener("input", () => { filters.q = inp.value; writeUrl(); drawList(); });
  fl.append(sw);
  const mkSel = (key, label, counts) => {
    const wrap = el("span", "select"); const s = el("select"); s.setAttribute("aria-label", label);
    s.append(Object.assign(el("option", null, label), { value: "" }));
    Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => { const o = el("option", null, `${k} (${n})`); o.value = k; o.selected = filters[key] === k; s.append(o); });
    if (filters[key] && !(filters[key] in counts)) { const o = el("option", null, filters[key]); o.value = filters[key]; o.selected = true; s.append(o); }
    s.classList.toggle("on", !!filters[key]);
    s.onchange = () => { filters[key] = s.value; s.classList.toggle("on", !!s.value); writeUrl(); render({ quiet: true }); };
    wrap.append(s, svg(CHEV_D)); return wrap;
  };
  const count = (fn) => { const o = {}; base.forEach(m => { const k = fn(m); if (k) o[k] = (o[k] || 0) + 1; }); return o; };
  fl.append(mkSel("tema", "Tema", themesIn(base)), mkSel("fonte", "Fonte", count(srcOf)), mkSel("local", "Local", count(placeOf)));
  if (filters.v === "todas") {
    const wrap = el("span", "select"); const s = el("select"); s.setAttribute("aria-label", "Período");
    for (const [k, lab] of [["7", "Últimos 7 dias"], ["30", "Últimos 30 dias"], ["9999", "Desde sempre"]]) { const o = el("option", null, lab); o.value = k; o.selected = filters.dias === k; s.append(o); }
    s.onchange = () => { filters.dias = s.value; writeUrl(); render({ quiet: true }); };
    wrap.append(s, svg(CHEV_D)); fl.append(wrap);
  }
  const active = filters.tema || filters.fonte || filters.local || filters.q;
  const clear = () => { filters.tema = filters.fonte = filters.local = filters.q = ""; writeUrl(); render({ quiet: true }); };
  if (active) { const c = el("button", "clear", "Limpar filtros"); c.type = "button"; c.onclick = clear; fl.append(c); }
  sticky.append(seg, fl);
  main.append(sticky);
  const listBox = el("div"); main.append(listBox);

  function drawList() {
    const q2 = filters.q.trim().toLowerCase();
    const rs = base.filter(m => (!filters.tema || (m.themes || []).includes(filters.tema)) && (!filters.fonte || srcOf(m) === filters.fonte)
      && (!filters.local || placeOf(m) === filters.local) && (!q2 || [m.title, m.company, m.location].join(" ").toLowerCase().includes(q2)));
    listBox.textContent = "";
    listBox.append(el("div", "count tnum", rs.length === base.length ? plural(rs.length, "vaga", "vagas") : `${rs.length} de ${plural(base.length, "vaga", "vagas")}`));
    if (!rs.length) {
      const e = el("div", "empty");
      if (base.length) { e.append(el("b", null, "Nenhuma vaga com estes filtros"), document.createTextNode("Experimenta outro tema ou local."));
        const c = el("button", "btn ghost", "Limpar filtros"); c.type = "button"; c.onclick = clear; e.append(el("br"), c); }
      else e.append(el("b", null, filters.v === "novas" ? "Nada de novo na última recolha" : "Ainda sem vagas"),
        document.createTextNode(filters.v === "novas" ? "Quando chegarem vagas novas, recebes uma notificação." : "As primeiras aparecem depois da próxima recolha."));
      listBox.append(e); return;
    }
    let dayK = null, list = null; const cards = [];
    for (const m of rs) {
      if (filters.v === "todas" && m.first_seen !== dayK) { dayK = m.first_seen; listBox.append(el("div", "day", ago(dayK) === "Hoje" ? "Hoje" : ago(dayK) === "Ontem" ? "Ontem" : fmt.format(day0(dayK)))); list = null; }
      if (!list) { list = el("div", "list"); listBox.append(list); }
      const c = card(m); cards.push(c); list.append(c);
    }
    if (!opts.quiet) { enter(cards.slice(0, 6), "jobs:" + current); }
    requestAnimationFrame(() => revealOnScroll(cards.slice(6)));
  }
  drawList();
  if (opts.quiet) listBox.classList.add("swap");
  stickyBar = sticky;
}
let stickyBar = null;
addEventListener("scroll", () => { if (stickyBar && stickyBar.isConnected) stickyBar.classList.toggle("scrolled", scrollY > stickyBar.offsetTop - (innerWidth > 900 ? 0 : 60)); }, { passive: true });

function group(...rows) { const g = el("div", "group"); g.append(...rows.filter(Boolean)); return g; }
function row(title, desc, right, lead) { const r = el("div", "row"); if (lead) r.append(lead); const t = el("div", "rt"); t.append(el("b", null, title));
  if (desc) t.append(el("span", null, desc)); r.append(t); if (right) r.append(right); return r; }
const rv = (txt, strong) => el("span", "rv tnum" + (strong ? " strong" : ""), txt);

function renderRules(main) {
  const p = profile(), r = p.rules || {}, y = r.years || {};
  header("Regras", `O que faz uma vaga chegar a ${p.name || "ti"}.`);
  main.append(el("h2", "sec", "Temas"));
  const det = r.strong_detail || (r.strong || []).map(l => ({ label: l, examples: [] }));
  main.append(group(...det.map((t, i) => row(t.label, t.examples && t.examples.length ? "Por exemplo: " + t.examples.join(", ") : null, null, el("span", "theme-ico tnum", String(i + 1))))));
  main.append(el("p", "note", "Cada tema encontrado no texto da vaga soma 3 pontos, ou 5 se estiver no título." +
    (r.require_theme ? " Uma vaga sem nenhum destes temas fica sempre de fora." : "")));
  if ((r.bonus || []).length) { main.append(el("h2", "sec", "Bónus")); main.append(group(...r.bonus.map(b => row(b[0].toUpperCase() + b.slice(1), "Pontos extra pelo setor da empresa.")))); }
  main.append(el("h2", "sec", "Filtros"));
  main.append(group(
    row("Pontuação mínima", "Abaixo disto, a vaga não chega até ti.", rv(`${r.min_score ?? "-"} pontos`, true)),
    row("Experiência pedida", "Vagas que pedem mais ou menos anos ficam de fora.", rv(`${y.min ?? 0} a ${y.max ?? "-"} anos`, true)),
    row("Idade da vaga", "Vagas publicadas há mais tempo são ignoradas.", rv(`Até ${r.max_age_days ?? "-"} dias`, true)),
    r.min_salary_eur ? row("Salário mínimo", "Só conta quando a vaga publica o salário.", rv(`${new Intl.NumberFormat("pt-PT").format(r.min_salary_eur)} €`, true)) : null,
    row("Zona", "Portugal continental e remoto aceite a partir de Portugal.", rv("Portugal", true))));
  if (repoEdit) { const a = el("a", "btn"); a.href = repoEdit; a.target = "_blank"; a.rel = "noopener"; a.append(document.createTextNode("Editar regras"), svg(I(P.ext, 16)));
    const w = el("div"); w.style.marginTop = "20px"; w.append(a, el("p", "note", "Abre a configuração no GitHub. As alterações contam a partir da recolha seguinte.")); main.append(w); }
}

function renderSettings(main) {
  const p = profile();
  header("Definições", "Aspeto da página, recolha e notificações.");
  main.append(el("h2", "sec", "Aspeto"));
  const wrap = el("span", "select"); const sel = el("select"); sel.id = "themeSel"; sel.setAttribute("aria-label", "Aspeto");
  for (const [k, lab] of [["light", "Claro"], ["dark", "Escuro"], ["auto", "Igual ao dispositivo"]]) { const o = el("option", null, lab); o.value = k; o.selected = theme() === k; sel.append(o); }
  sel.onchange = () => { store.set("vagas-tema", sel.value); applyTheme(); };
  wrap.append(sel, svg(CHEV_D));
  main.append(group(row("Tema", "Claro, escuro ou igual ao do teu dispositivo.", wrap)));
  main.append(el("h2", "sec", "Recolha"));
  const src = el("div"); (tracker.sources || []).forEach(s => { const st = s.status || ""; const r = el("div", "src-row");
    r.append(el("span", null, s.name), el("span", /ERRO/.test(st) ? "bad" : "tnum", /ERRO/.test(st) ? "Com erro" : (st.replace(/^ok, /, "").replace(/ \(.*\)$/, "") || "Sem dados"))); src.append(r); });
  const fontes = row("Fontes", null); fontes.querySelector(".rt").append(src);
  main.append(group(row("Horário", tracker.schedule || "Todos os dias, duas vezes", rv(`Última a ${fmt.format(day0(updated))}`)), (tracker.sources || []).length ? fontes : null));
  main.append(el("h2", "sec", "Notificações"));
  main.append(group(row(`Notificações de ${p.name || "este perfil"}`, p.channel ? "Na app ntfy, só com as vagas novas deste perfil e uma única vez por vaga." : "Este perfil ainda não tem canal ntfy.")));
}

// ---------- janela de perfis ----------
let opener = null;
function openModal(e) {
  opener = e.currentTarget;
  if (profiles.length < 2) return nope(opener);
  const list = $("plist"); list.textContent = "";
  for (const p of profiles) {
    const b = el("button", "pitem"); b.type = "button"; b.setAttribute("aria-current", p.id === current);
    const i = el("span", "pinfo"); i.append(el("div", "pn", p.name || p.id), el("div", "ph", p.headline || ""));
    const av = el("span", "avatar", initials(p.name || p.id)); av.setAttribute("aria-hidden", "true");
    b.append(av, i, svg(TICK)); b.onclick = () => { closeModal(true); select(p.id); }; list.append(b);
  }
  $("modal").classList.add("open"); $("scrim").classList.add("open");
  setTimeout(() => (list.querySelector('[aria-current="true"]') || list.firstChild).focus(), 30);
}
function closeModal(restore) {
  if (!$("modal").classList.contains("open")) return;
  $("modal").classList.remove("open"); $("scrim").classList.remove("open");
  if (restore && opener) opener.focus();
}
$("profileBtn").onclick = openModal; $("mProfileBtn").onclick = openModal; $("scrim").onclick = () => closeModal(true);
$("settingsBtn").onclick = () => go("settings");
document.addEventListener("keydown", e => {
  if (!$("modal").classList.contains("open")) return;
  const items = [...$("modal").querySelectorAll(".pitem")], i = items.indexOf(document.activeElement);
  if (e.key === "Escape") { e.preventDefault(); closeModal(true); }
  else if (e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey)) { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
});

function select(pid) {
  if (!profiles.some(p => p.id === pid)) pid = profiles[0].id;
  current = pid; store.set("vagas-perfil", pid);
  data = viewFor(pid); marks = store.get(markKey(pid), {}); seen = store.get(seenKey(pid), {});
  document.title = profile().name ? `Vagas de ${profile().name}` : "Vagas";
  filters.tema = filters.fonte = filters.local = "";
  go(page);
}

fetch("jobs.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  updated = d.updated; tracker = d.tracker || {};
  profiles = (d.profiles && d.profiles.length) ? d.profiles : [{ id: "eu", name: "" }];
  all = (d.matches || []).slice().sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") || ((b.fit ?? b.score * 5) - (a.fit ?? a.score * 5)));
  const h = readUrl();
  if (h.pg) page = h.pg;
  const pid = h.pid || store.get("vagas-perfil", profiles[0].id);
  current = profiles.some(p => p.id === pid) ? pid : profiles[0].id;
  select(current);
}).catch(() => { $("sub").textContent = "Não foi possível carregar as vagas. Tenta recarregar a página."; });
addEventListener("hashchange", () => { const h = readUrl(); if (!profiles.length) return;
  if (h.pid && h.pid !== current) { if (h.pg) page = h.pg; select(h.pid); } else if (h.pg && h.pg !== page) go(h.pg); });
</script>

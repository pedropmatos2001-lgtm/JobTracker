<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vagas">
<meta name="theme-color" content="#f5f5f7">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vagas</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7; --side: #fbfbfd; --surface: #ffffff; --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.07); --hover: rgba(0,0,0,.04);
    --label: #1d1d1f; --label-2: #6e6e73; --label-3: #86868b; --sep: rgba(60,60,67,.14);
    --blue: #0071e3; --blue-soft: rgba(0,113,227,.08); --green: #1d7d39; --green-soft: rgba(36,138,61,.1); --orange: #b25000;
    --bar: rgba(245,245,247,.8); --modal: rgba(255,255,255,.97); --seg-on: #ffffff; --current: rgba(0,0,0,.055);
    --avatar-bg: #1d1d1f; --avatar-fg: #ffffff; --card-shadow: 0 1px 2px rgba(0,0,0,.04), 0 0 0 .5px rgba(0,0,0,.06);
    --card-hover: 0 8px 24px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.06);
    --motion-100: 100ms; --motion-150: 150ms; --motion-200: 200ms; --motion-300: 300ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #000000; --side: #161617; --surface: #1c1c1e; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16); --hover: rgba(255,255,255,.06);
    --label: #f5f5f7; --label-2: #a1a1a6; --label-3: #8e8e93; --sep: rgba(84,84,88,.5);
    --blue: #2997ff; --blue-soft: rgba(41,151,255,.14); --green: #30d158; --green-soft: rgba(48,209,88,.14); --orange: #ff9f0a;
    --bar: rgba(0,0,0,.72); --modal: rgba(44,44,46,.97); --seg-on: #636366; --current: rgba(255,255,255,.08);
    --avatar-bg: #f5f5f7; --avatar-fg: #1d1d1f; --card-shadow: 0 0 0 .5px rgba(255,255,255,.08); --card-hover: 0 8px 24px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--label); -webkit-font-smoothing: antialiased;
         font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; letter-spacing: -.01em; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  a { color: var(--blue); }
  svg { flex: none; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 32px; }

  /* ---------- barra lateral ---------- */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow: hidden auto; background: var(--side); border-right: .5px solid var(--sep);
          padding: 22px 12px 12px; display: flex; flex-direction: column; min-width: 0; }
  .brand { font-size: 19px; font-weight: 700; padding: 0 10px 20px; letter-spacing: -.03em; }
  .nav { display: grid; gap: 2px; }
  .nav + .nav { margin-top: 18px; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 7px 10px; border: 0; border-radius: 9px;
          background: transparent; text-align: left; cursor: pointer; font-size: 14px; color: var(--label); text-decoration: none;
          transition: background-color var(--motion-150) var(--ease-out); }
  .item svg { color: var(--label-2); }
  .item:hover { background: var(--hover); }
  .item[aria-current=page] { background: var(--current); font-weight: 600; }
  .item[aria-current=page] svg { color: var(--blue); }
  .item .n { margin-left: auto; font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; font-weight: 400; }
  .bottom { margin-top: auto; display: grid; gap: 2px; padding-top: 10px; border-top: .5px solid var(--sep); }
  .profile-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; border: 0; background: transparent; padding: 8px 10px;
                 border-radius: 10px; cursor: pointer; text-align: left; min-height: 52px; transition: background-color var(--motion-150) var(--ease-out); }
  .profile-btn:hover { background: var(--hover); }
  .profile-btn .chev { color: var(--label-3); margin-left: auto; }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--avatar-bg); color: var(--avatar-fg);
            font-weight: 600; font-size: 13px; letter-spacing: 0; }
  .pinfo { min-width: 0; }
  .pn { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .ph { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- janela de perfis ---------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity var(--motion-150) var(--ease-in); }
  .scrim.open { opacity: 1; pointer-events: auto; transition: opacity var(--motion-200) var(--ease-out); }
  .modal { position: fixed; z-index: 31; left: 50%; top: 50%; width: min(380px, calc(100vw - 32px)); background: var(--modal);
           backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px); border-radius: 18px; padding: 20px 12px 12px;
           box-shadow: 0 24px 60px rgba(0,0,0,.2), 0 0 0 .5px rgba(0,0,0,.08);
           opacity: 0; visibility: hidden; transform: translate(-50%, -48%) scale(.97); pointer-events: none;
           transition: opacity var(--motion-150) var(--ease-in), transform var(--motion-150) var(--ease-in), visibility 0s linear var(--motion-150); }
  .modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); pointer-events: auto;
                transition: opacity var(--motion-200) var(--ease-out), transform var(--motion-200) var(--ease-out), visibility 0s; }
  .modal h2 { font-size: 17px; font-weight: 600; margin: 0 10px 12px; }
  .plist { display: grid; gap: 4px; }
  .pitem { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; border: 0; background: transparent; padding: 10px; border-radius: 12px;
           text-align: left; cursor: pointer; min-height: 60px; transition: background-color var(--motion-100) var(--ease-out); }
  .pitem:hover, .pitem:focus-visible { background: var(--hover); }
  .pitem[aria-current=true] { background: var(--blue-soft); }
  .pitem .avatar { width: 40px; height: 40px; font-size: 14px; }
  .pitem .pinfo { flex: 1; }
  .pitem .tick { color: var(--blue); visibility: hidden; }
  .pitem[aria-current=true] .tick { visibility: visible; }

  /* ---------- cabeçalho e filtros ---------- */
  header.wrap { padding-top: 52px; padding-bottom: 6px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--label-2); margin-bottom: 6px; }
  h1 { font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -.035em; margin: 0; }
  h1.swap, .eyebrow.swap { animation: fade var(--motion-200) var(--ease-out); }
  .sub { color: var(--label-2); font-size: 17px; margin-top: 8px; letter-spacing: -.015em; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bar); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px);
         border-bottom: .5px solid transparent; transition: border-color var(--motion-150) var(--ease-out); }
  .bar.scrolled { border-bottom-color: var(--sep); }
  .bar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 18px; padding-bottom: 14px; }
  .search { position: relative; flex: 1 1 240px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--label-3); }
  input[type=search] { width: 100%; padding: 9px 12px 9px 34px; border: 0; border-radius: 10px; background: var(--fill); outline: none; font-size: 15px;
                       -webkit-appearance: none; appearance: none; }
  input[type=search]::placeholder { color: var(--label-3); }
  input[type=search]:focus { box-shadow: 0 0 0 3px rgba(0,113,227,.25); }
  .seg { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: transparent; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 8px; cursor: pointer;
                transition: background-color var(--motion-150) var(--ease-out), box-shadow var(--motion-150) var(--ease-out); }
  .seg button[aria-pressed=true] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
  .select { position: relative; }
  .select select { -webkit-appearance: none; appearance: none; border: 0; background: var(--fill); border-radius: 10px; padding: 7px 30px 7px 12px;
                   font-size: 13px; font-weight: 500; cursor: pointer; }
  .select svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--label-2); }

  /* ---------- vagas ---------- */
  main { padding-bottom: 64px; }
  .day { font-size: 20px; font-weight: 700; letter-spacing: -.025em; margin: 30px 0 12px; }
  .day:first-child { margin-top: 14px; }
  .list { display: grid; gap: 12px; }
  .job { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px; padding: 18px 20px; background: var(--surface);
         border-radius: 18px; box-shadow: var(--card-shadow);
         transition: box-shadow var(--motion-200) var(--ease-out), transform var(--motion-200) var(--ease-out); }
  @media (hover: hover) { .job:hover { box-shadow: var(--card-hover); transform: translateY(-2px); } }
  .job.enter { animation: rise var(--motion-300) var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 30ms); }
  .logo { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--fill-2); color: var(--label-2);
          font-weight: 700; font-size: 17px; letter-spacing: -.02em; overflow: hidden; box-shadow: inset 0 0 0 .5px var(--sep); }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .jt { min-width: 0; }
  .toprow { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
  .title { font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--label); text-decoration: none; letter-spacing: -.02em; }
  .title::after { content: ""; position: absolute; inset: 0; border-radius: 18px; }
  .title:focus-visible { outline: none; }
  .job:has(.title:focus-visible) { box-shadow: 0 0 0 3px var(--blue); }
  .company { font-size: 15px; color: var(--label); margin-top: 3px; }
  .meta { font-size: 13px; color: var(--label-2); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg { color: var(--label-3); }
  .fit { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .fit.high, .themes .fit.high { background: var(--green-soft); color: var(--green); }
  .fit.good, .themes .fit.good { background: var(--blue-soft); color: var(--blue); }
  .themes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .themes .fit-m { display: none; }
  .themes span { font-size: 12px; font-weight: 500; color: var(--label-2); background: var(--fill-2); border-radius: 7px; padding: 4px 9px; }
  .warn { font-size: 12px; color: var(--orange); margin-top: 10px; }
  .new { color: var(--blue); font-weight: 600; }
  .empty { text-align: center; padding: 72px 20px; color: var(--label-2); background: var(--surface); border-radius: 18px; box-shadow: var(--card-shadow); margin-top: 14px; }
  .empty b { display: block; color: var(--label); font-size: 19px; font-weight: 600; margin-bottom: 6px; letter-spacing: -.02em; }

  /* ---------- páginas de regras e definições ---------- */
  .page { display: grid; gap: 30px; padding-top: 18px; }
  .page.enter { animation: rise var(--motion-300) var(--ease-out) backwards; }
  .sgroup h3 { font-size: 20px; font-weight: 700; margin: 0 0 12px; letter-spacing: -.025em; }
  .scard { background: var(--surface); border-radius: 18px; box-shadow: var(--card-shadow); overflow: hidden; }
  .srow { display: flex; align-items: center; gap: 16px; padding: 16px 20px; min-height: 64px; }
  .srow + .srow { border-top: .5px solid var(--sep); }
  .st { flex: 1; min-width: 0; }
  .st b { display: block; font-size: 15px; font-weight: 500; }
  .st span { display: block; font-size: 13px; color: var(--label-2); margin-top: 2px; }
  .sv { flex: none; text-align: right; font-size: 15px; color: var(--label-2); font-variant-numeric: tabular-nums; }
  .sv.strong { color: var(--label); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { font-size: 13px; color: var(--label); background: var(--fill-2); border-radius: 8px; padding: 5px 10px; }
  .pill { border: 0; background: var(--blue); color: #fff; border-radius: 999px; padding: 9px 18px; font-size: 14px; font-weight: 500; cursor: pointer;
          text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
          transition: transform var(--motion-100) var(--ease-out), filter var(--motion-150) var(--ease-out); }
  .pill:hover { filter: brightness(1.08); }
  .pill:active { transform: scale(.97); }
  .src { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 3px 0; }
  .src .ok { color: var(--label-2); } .src .bad { color: var(--orange); }
  .note { font-size: 13px; color: var(--label-2); margin: 10px 4px 0; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  @media (pointer: coarse) { .seg button, .select select, .item { min-height: 44px; } }

  /* ---------- telemóvel: barra de topo e separadores em baixo ---------- */
  .topbar, .tabs { display: none; }
  @media (max-width: 900px) {
    .app { display: block; }
    .side { display: none; }
    .topbar { display: flex; position: sticky; top: 0; z-index: 10; align-items: center; justify-content: space-between; padding: 6px 10px 6px 16px;
              background: var(--bar); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px); border-bottom: .5px solid var(--sep); }
    .topbar .brand { padding: 0; font-size: 17px; }
    .topbar .profile-btn { width: auto; min-height: 44px; padding: 4px 6px; gap: 8px; }
    .topbar .profile-btn .ph { display: none; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
            background: var(--bar); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px);
            border-top: .5px solid var(--sep); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
    .tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 0; min-height: 50px; cursor: pointer;
                   font-size: 10px; font-weight: 500; color: var(--label-3); }
    .tabs button[aria-current=page] { color: var(--blue); }
    .bar { top: 57px; }
    header.wrap { padding-top: 22px; }
    h1 { font-size: 32px; }
    .wrap { padding: 0 16px; }
    main { padding-bottom: 100px; }
    .job { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 16px; }
    .logo { width: 44px; height: 44px; font-size: 15px; border-radius: 10px; }
    .toprow .fit { display: none; }
    .themes .fit-m { display: inline-block; }
    .modal { left: 8px; right: 8px; top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); width: auto; transform: translateY(110%); }
    .modal.open { transform: none; transition: opacity var(--motion-200) var(--ease-out), transform var(--motion-300) var(--ease-out), visibility 0s; }
    .srow { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    .job.enter, .page.enter, h1.swap, .eyebrow.swap { animation: fade var(--motion-150) ease backwards; animation-delay: 0ms; }
    .job:hover { transform: none; }
    .pill:active { transform: none; }
    .modal, .modal.open { transform: translate(-50%, -50%); transition: opacity var(--motion-100) ease, visibility 0s; }
  }
  @media (prefers-reduced-motion: reduce) and (max-width: 900px) { .modal, .modal.open { transform: none; } }
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="Navegação">
  <div class="brand">Vagas</div>
  <nav class="nav" id="nav1"></nav>
  <nav class="nav" id="nav2"></nav>
  <div class="bottom">
    <button class="profile-btn" type="button" id="profileBtn" aria-haspopup="dialog" aria-controls="modal"></button>
  </div>
</aside>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h2 id="mTitle">Perfis</h2>
  <div class="plist" id="plist"></div>
</div>

<div class="content">
  <div class="topbar"><span class="brand">Vagas</span><button class="profile-btn" type="button" id="mProfileBtn" aria-haspopup="dialog" aria-controls="modal"></button></div>
  <header class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1">Vagas</h1>
    <div class="sub" id="sub">A carregar</div>
  </header>
  <div class="bar" id="bar">
    <div class="wrap">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Pesquisar" aria-label="Pesquisar título, empresa ou local">
      </div>
      <div class="seg" id="days" role="group" aria-label="Período">
        <button type="button" data-d="7" aria-pressed="true">7 dias</button>
        <button type="button" data-d="30">30 dias</button>
        <button type="button" data-d="9999">Tudo</button>
      </div>
      <span class="select" id="srcWrap"><select id="src" aria-label="Fonte"></select>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
  </div>
  <main class="wrap"><div id="list"></div></main>
  <nav class="tabs" id="tabs" aria-label="Secções"></nav>
</div>
</div>

<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svg = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const I = (d, w = 17) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  new: I('<path d="M3 13l2.6-7.2A2 2 0 0 1 7.5 4.5h9a2 2 0 0 1 1.9 1.3L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>'),
  all: I('<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M3 12.5h18"/>'),
  rules: I('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  settings: I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  pin: I('<path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>', 14),
  clock: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 14),
  globe: I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', 14),
  chev: '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>',
  tick: '<svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  ext: I('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', 15),
};
const repoEdit = (() => { const u = location.hostname.split(".")[0], r = location.pathname.split("/")[1];
  return location.hostname.endsWith("github.io") && r ? `https://github.com/${u}/${r}/edit/main/config.yaml` : ""; })();

// aspeto: Claro, Escuro ou Sistema
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() { const t = store.get("vagas-tema", "auto"); document.documentElement.dataset.theme = t === "auto" ? (mq.matches ? "dark" : "light") : t; }
applyTheme(); (mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme));

const SRC = { linkedin: "LinkedIn", indeed: "Indeed", bep: "Emprego público", remotive: "Remoto" };
const srcOf = m => SRC[(m.source || "").split(":")[0]] || "Site da empresa";
const initials = s => (s || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const PAGES = [
  { id: "new", label: "Novas hoje", icon: ICON.new, nav: 1 },
  { id: "all", label: "Todas as vagas", icon: ICON.all, nav: 1 },
  { id: "rules", label: "Ajustar regras", icon: ICON.rules, nav: 2 },
  { id: "settings", label: "Definições", icon: ICON.settings, nav: 2 },
];

let profiles = [], current = "", all = [], data = [], updated = "", tracker = {};
let page = "new", days = 7, src = "Todas", animateNext = true;

const ageDays = iso => Math.round((new Date(updated + "T00:00:00") - new Date((iso || updated) + "T00:00:00")) / 864e5);
const fmtDay = iso => { const a = ageDays(iso); if (a === 0) return "Hoje"; if (a === 1) return "Ontem";
  const s = new Date(iso + "T00:00:00").toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" }); return s[0].toUpperCase() + s.slice(1); };
const ago = iso => { const a = ageDays(iso); return a <= 0 ? "Publicada hoje" : a === 1 ? "Publicada ontem" : `Publicada há ${a} dias`; };
const dateLong = iso => new Date(iso + "T00:00:00").toLocaleDateString("pt-PT", { day: "numeric", month: "long" });
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function viewFor(pid) {
  const first = profiles[0] && profiles[0].id;
  return all.filter(m => m.profiles ? pid in m.profiles : pid === first).map(m => {
    const pp = (m.profiles || {})[pid] || {};
    return { ...m, score: pp.score ?? m.score, flags: pp.flags ?? m.flags, fit: pp.fit ?? m.fit, themes: pp.themes || [] };
  });
}
const newCount = () => data.filter(m => m.first_seen === updated).length;
const avatarOf = p => { const a = el("span", "avatar", initials(p.name || p.id)); a.setAttribute("aria-hidden", "true"); return a; };
const profile = () => profiles.find(x => x.id === current) || {};

// ---------- navegação ----------
function renderNav() {
  const counts = { new: newCount(), all: data.length };
  for (const n of [1, 2]) {
    const nav = $("nav" + n); nav.textContent = "";
    for (const pg of PAGES.filter(x => x.nav === n)) {
      const b = el("button", "item"); b.type = "button"; b.append(svg(pg.icon), document.createTextNode(pg.label));
      if (counts[pg.id] != null) b.append(el("span", "n", counts[pg.id]));
      if (pg.id === page) b.setAttribute("aria-current", "page");
      b.onclick = () => go(pg.id);
      nav.append(b);
    }
  }
  const tabs = $("tabs"); tabs.textContent = "";
  for (const pg of PAGES) {
    const b = el("button"); b.type = "button"; b.append(svg(pg.icon.replace(/width="17" height="17"/, 'width="22" height="22"')),
      el("span", null, pg.id === "new" ? "Novas" : pg.id === "all" ? "Todas" : pg.id === "rules" ? "Regras" : "Definições"));
    if (pg.id === page) b.setAttribute("aria-current", "page");
    b.onclick = () => go(pg.id); tabs.append(b);
  }
  const p = profile();
  for (const id of ["profileBtn", "mProfileBtn"]) {
    const b = $(id); b.textContent = "";
    const info = el("span", "pinfo"); info.append(el("div", "pn", p.name || "Perfil"), el("div", "ph", p.headline || ""));
    b.append(avatarOf(p), info, svg(ICON.chev));
    b.setAttribute("aria-label", `Perfil de ${p.name || "utilizador"}. Trocar de perfil`);
    b.style.display = profiles.length > 1 ? "" : "none";
  }
}

function setHeader() {
  const p = profile(), n = newCount(), who = p.name || "";
  const titles = { new: "Novas hoje", all: "Todas as vagas", rules: "Ajustar regras", settings: "Definições" };
  $("eyebrow").textContent = who ? `Perfil de ${who}` : "";
  $("h1").textContent = titles[page];
  $("sub").textContent = {
    new: n ? `${plural(n, "vaga nova", "vagas novas")} desde a última recolha, a ${dateLong(updated)}.` : `Sem vagas novas na recolha de ${dateLong(updated)}.`,
    all: `${plural(data.length, "vaga guardada", "vagas guardadas")} que passaram as regras deste perfil.`,
    rules: "O que conta para uma vaga chegar até ti.",
    settings: "Aspeto da página, recolha e notificações.",
  }[page];
  for (const id of ["h1", "eyebrow"]) { $(id).classList.remove("swap"); void $(id).offsetWidth; $(id).classList.add("swap"); }
}

function go(id, push = true) {
  page = id; animateNext = true;
  if (push) history.replaceState(null, "", `#${current}/${id}`);
  renderNav(); setHeader(); render(); scrollTo(0, 0);
}

// ---------- vagas ----------
function fitLabel(m) {
  const s = m.fit != null ? m.fit / 5 : m.score;
  return s >= 15 ? ["Encaixe muito alto", "high"] : s >= 11 ? ["Bom encaixe", "good"] : null;
}
function card(m) {
  const a0 = el("article", "job");
  const logo = el("div", "logo"); logo.setAttribute("aria-hidden", "true");
  if (m.logo) { const img = new Image(); img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.src = m.logo;
    img.onerror = () => { logo.textContent = initials(m.company); }; logo.append(img); }
  else logo.textContent = initials(m.company);
  const t = el("div", "jt");
  const top = el("div", "toprow");
  const a = el("a", "title", m.title); a.href = m.url; a.target = "_blank"; a.rel = "noopener";
  top.append(a);
  const f = fitLabel(m); if (f) top.append(el("span", "fit " + f[1], f[0]));
  t.append(top, el("div", "company", m.company || ""));
  const meta = el("div", "meta");
  if (m.location) { const s = el("span"); s.append(svg(ICON.pin), document.createTextNode(m.location.replace(/, Portugal$/, ""))); meta.append(s); }
  const d = el("span"); d.append(svg(ICON.clock), document.createTextNode(ago(m.posted || m.first_seen))); meta.append(d);
  const so = el("span"); so.append(svg(ICON.globe), document.createTextNode(srcOf(m))); meta.append(so);
  if (m.first_seen === updated && page !== "new") meta.append(el("span", "new", "Nova"));
  t.append(meta);
  const th = el("div", "themes"); (m.themes || []).forEach(x => th.append(el("span", null, x)));
  if (f) th.append(el("span", "fit fit-m " + f[1], f[0]));        // no telemóvel a etiqueta vem para aqui
  if (th.children.length) t.append(th);
  const w = (m.flags || []).find(x => /anos|língua|lingua|holand|alem|franc/.test(x) && !/não indica anos/.test(x));
  if (w) t.append(el("div", "warn", w[0].toUpperCase() + w.slice(1)));
  a0.append(logo, t);
  return a0;
}
function render() {
  const isList = page === "new" || page === "all";
  $("bar").style.display = isList ? "" : "none";
  $("days").style.display = page === "all" ? "" : "none";
  $("srcWrap").style.display = page === "all" ? "" : "none";
  const box = $("list"); box.textContent = "";
  if (page === "rules") return renderRules(box);
  if (page === "settings") return renderSettings(box);
  const q = $("q").value.trim().toLowerCase();
  const rows = data.filter(m => page === "new" ? m.first_seen === updated : ageDays(m.first_seen) < days)
    .filter(m => page === "new" || src === "Todas" || srcOf(m) === src)
    .filter(m => !q || [m.title, m.company, m.location].join(" ").toLowerCase().includes(q));
  if (!rows.length) {
    const e = el("div", "empty");
    const msg = q ? ["Sem resultados", "Experimenta outra pesquisa."]
      : page === "new" ? ["Nada de novo hoje", "Quando houver vagas novas, aparecem aqui e recebes uma notificação."]
      : ["Ainda sem vagas", "As primeiras aparecem depois da próxima recolha."];
    e.append(el("b", null, msg[0]), document.createTextNode(msg[1])); box.append(e); return;
  }
  const animate = animateNext; animateNext = false;
  let day = null, list = null, i = 0;
  for (const m of rows) {
    if (page === "all" && m.first_seen !== day) { day = m.first_seen; box.append(el("h2", "day", fmtDay(day))); list = null; }
    if (!list) { list = el("div", "list"); box.append(list); }
    const c = card(m);
    if (animate) { c.classList.add("enter"); c.style.setProperty("--i", Math.min(i++, 6)); }
    list.append(c);
  }
}

// ---------- regras e definições ----------
const row = (title, desc, right) => { const r = el("div", "srow"); const t = el("div", "st"); t.append(el("b", null, title));
  if (desc) t.append(el("span", null, desc)); r.append(t); if (right) r.append(right); return r; };
const group = (title, ...rows) => { const g = el("section", "sgroup"); if (title) g.append(el("h3", null, title)); const c = el("div", "scard"); c.append(...rows.filter(Boolean)); g.append(c); return g; };
const pageWrap = () => { const w = el("div", "page" + (animateNext ? " enter" : "")); animateNext = false; return w; };
function renderRules(box) {
  const p = profile(), r = p.rules || {}, w = pageWrap();
  const themes = row("Temas que contam mais", "Cada tema encontrado na vaga soma pontos. No título, soma mais.");
  const ch = el("div", "chips"); (r.strong || []).forEach(x => ch.append(el("span", null, x))); themes.querySelector(".st").append(ch);
  const bonus = (r.bonus || []).length ? row("Bónus", "Pontos extra pelo tipo de entidade.") : null;
  if (bonus) { const b = el("div", "chips"); r.bonus.forEach(x => b.append(el("span", null, x[0].toUpperCase() + x.slice(1)))); bonus.querySelector(".st").append(b); }
  w.append(group("Temas", themes, bonus));
  const y = r.years || {};
  w.append(group("Filtros",
    row("Pontuação mínima", "Abaixo disto, a vaga não chega até ti.", el("span", "sv strong", `${r.min_score ?? "-"} pontos`)),
    row("Experiência pedida", "Vagas que pedem mais ou menos anos ficam de fora.", el("span", "sv strong", `${y.min ?? 0} a ${y.max ?? "-"} anos`)),
    row("Idade máxima da vaga", null, el("span", "sv strong", `${r.max_age_days ?? "-"} dias`)),
    r.min_salary_eur ? row("Salário mínimo", "Só conta quando a vaga publica o salário.", el("span", "sv strong", `${r.min_salary_eur.toLocaleString("pt-PT")} €`)) : null,
    row("Zona", "Portugal continental e remoto aceite em Portugal.", el("span", "sv strong", "Portugal"))));
  if (repoEdit) {
    const a = el("a", "pill"); a.href = repoEdit; a.target = "_blank"; a.rel = "noopener"; a.append(document.createTextNode("Editar regras"), svg(ICON.ext));
    const g = group(null, row("Alterar estas regras", "Abre a configuração no GitHub. As mudanças contam a partir da recolha seguinte.", a)); w.append(g);
  }
  box.append(w);
}
function renderSettings(box) {
  const p = profile(), w = pageWrap();
  const seg = el("div", "seg"); const cur = store.get("vagas-tema", "auto");
  for (const [k, lab] of [["light", "Claro"], ["dark", "Escuro"], ["auto", "Sistema"]]) {
    const b = el("button", null, lab); b.type = "button"; b.setAttribute("aria-pressed", k === cur);
    b.onclick = () => { store.set("vagas-tema", k); applyTheme(); seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    seg.append(b);
  }
  w.append(group("Aspeto", row("Tema", "Sistema segue o tema do teu dispositivo.", seg)));
  const fontes = row("Fontes", null); const lst = el("div");
  for (const s of tracker.sources || []) {
    const st = s.status || "";
    const line = el("div", "src"); line.append(el("span", null, s.name));
    line.append(el("span", /ERRO/.test(st) ? "bad" : "ok", /ERRO/.test(st) ? "Com erro" : st.replace(/^ok, /, "").replace(/ \(.*\)$/, "") || "Sem dados"));
    lst.append(line);
  }
  fontes.querySelector(".st").append(lst);
  w.append(group("Recolha",
    row("Horário", tracker.schedule || "Todos os dias, duas vezes", el("span", "sv", `Última a ${dateLong(updated)}`)),
    fontes));
  w.append(group("Notificações",
    row(`Notificações de ${p.name || "este perfil"}`, p.channel ? "Na app ntfy, só com as vagas novas deste perfil e uma única vez por vaga." : "Este perfil ainda não tem canal ntfy.")));
  box.append(w);
}

function buildSources() {
  const sel = $("src"); sel.textContent = "";
  const n = {}; data.forEach(m => { n[srcOf(m)] = (n[srcOf(m)] || 0) + 1; });
  for (const k of ["Todas", ...Object.keys(n).sort((a, b) => n[b] - n[a])]) {
    const o = el("option", null, k === "Todas" ? "Todas as fontes" : `${k} (${n[k]})`); o.value = k; o.selected = k === src; sel.append(o);
  }
}
$("src").onchange = e => { src = e.target.value; animateNext = true; render(); };

// ---------- janela de perfis ----------
let opener = null;
function openModal(e) {
  opener = e.currentTarget;
  const list = $("plist"); list.textContent = "";
  for (const p of profiles) {
    const b = el("button", "pitem"); b.type = "button"; b.setAttribute("aria-current", p.id === current);
    const i = el("span", "pinfo"); i.append(el("div", "pn", p.name || p.id), el("div", "ph", p.headline || ""));
    b.append(avatarOf(p), i, svg(ICON.tick));
    b.onclick = () => { closeModal(true); select(p.id); };
    list.append(b);
  }
  $("modal").classList.add("open"); $("scrim").classList.add("open");
  setTimeout(() => (list.querySelector('[aria-current="true"]') || list.firstChild).focus(), 30);
}
function closeModal(restore) {
  if (!$("modal").classList.contains("open")) return;
  $("modal").classList.remove("open"); $("scrim").classList.remove("open");
  if (restore && opener) opener.focus();
}
$("profileBtn").onclick = openModal; $("mProfileBtn").onclick = openModal; $("scrim").onclick = () => closeModal(true);
document.addEventListener("keydown", e => {
  if (!$("modal").classList.contains("open")) return;
  const items = [...$("modal").querySelectorAll(".pitem")];
  const i = items.indexOf(document.activeElement);
  if (e.key === "Escape") { e.preventDefault(); closeModal(true); }
  else if (e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey)) { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
});

function select(pid, toPage) {
  if (!profiles.some(p => p.id === pid)) pid = profiles[0].id;
  current = pid; store.set("vagas-perfil", pid);
  data = viewFor(pid);
  if (toPage) page = toPage;
  document.title = profile().name ? `Vagas de ${profile().name}` : "Vagas";
  src = "Todas"; buildSources(); go(page);
}

function fromHash() { const [pid, pg] = location.hash.slice(1).split("/"); return { pid, pg: PAGES.some(x => x.id === pg) ? pg : null }; }
fetch("jobs.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  updated = d.updated; tracker = d.tracker || {};
  profiles = (d.profiles && d.profiles.length) ? d.profiles : [{ id: "eu", name: "" }];
  all = (d.matches || []).slice().sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") ||
    ((b.fit ?? b.score * 5) - (a.fit ?? a.score * 5)));
  const h = fromHash();
  const pid = h.pid || store.get("vagas-perfil", profiles[0].id);
  const first = viewFor(profiles.some(p => p.id === pid) ? pid : profiles[0].id);
  select(pid, h.pg || (first.some(m => m.first_seen === updated) ? "new" : "all"));
}).catch(() => { $("sub").textContent = "Não foi possível carregar as vagas. Tenta recarregar a página."; });

document.querySelectorAll("#days button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#days button").forEach(x => x.setAttribute("aria-pressed", x === b)); days = +b.dataset.d; animateNext = true; render(); });
$("q").addEventListener("input", render);
addEventListener("hashchange", () => { const h = fromHash(); if (profiles.length && h.pid && (h.pid !== current || (h.pg && h.pg !== page))) select(h.pid, h.pg || page); });
addEventListener("scroll", () => $("bar").classList.toggle("scrolled", scrollY > 120), { passive: true });
</script>
</body>
</html>

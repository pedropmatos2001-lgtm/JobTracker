<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vagas">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Vagas</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --card: #ffffff; --ink: #0f172a; --ink-2: #475569; --ink-3: #556070;
    --line: #e5e7eb; --line-2: #eef0f3; --accent: #2563eb; --accent-soft: #eff6ff;
    --new: #047857; --new-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb;
    --motion-100: 100ms; --motion-150: 150ms; --motion-200: 200ms; --motion-300: 300ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
    --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, -apple-system, system-ui, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }

  /* barra lateral de perfis */
  .app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card); border-right: 1px solid var(--line);
          padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; min-width: 0; overflow-x: hidden; }
  .side > * { min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; padding: 0 6px; }
  .brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; }
  .plabel { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 0 8px; margin-bottom: 6px; }
  .profiles { display: grid; gap: 2px; grid-template-columns: minmax(0, 1fr); }
  .pbtn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 8px; border-radius: 10px;
          text-align: left; cursor: pointer; font: inherit; color: var(--ink); min-height: 48px; min-width: 0;
          transition: background-color var(--motion-150) var(--ease-out), transform var(--motion-100) var(--ease-out); }
  .pbtn:hover { background: #f4f6f8; }
  .pbtn:active { transform: scale(.98); }
  .pbtn[aria-current=true] { background: var(--accent-soft); }
  .pbtn[aria-current=true] .pn { color: var(--accent); }
  .avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 13px; }
  .pinfo { min-width: 0; flex: 1; }
  .pn { font-size: 14px; font-weight: 600; line-height: 1.25; transition: color var(--motion-150) var(--ease-out); }
  .ph { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcount { flex: none; font-size: 12px; font-weight: 600; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px;
            background: var(--new-soft); color: var(--new); font-variant-numeric: tabular-nums; }
  .pcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
  .pcard.swap { animation: fade var(--motion-200) var(--ease-out); }
  .pcard h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .pcard .ph { white-space: normal; margin-top: 2px; }
  .ptags { display: flex; gap: 6px; flex-wrap: wrap; }
  .ptags span { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px; background: #f1f5f9; color: var(--ink-2); }
  .plang { font-size: 12px; color: var(--ink-2); }
  .pacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .side .foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 0 6px; display: grid; gap: 8px; }
  .side .foot a { color: var(--ink-2); font-weight: 500; text-decoration: none; }
  .side .foot a:hover { color: var(--accent); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  h1.swap { animation: fade var(--motion-200) var(--ease-out); }

  /* cabeçalho */
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 28px; padding-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -.02em; font-weight: 700; }
  .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .stats { display: flex; gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 92px; background: var(--card); }
  .stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); font-size: 12px; }

  /* barra de filtros */
  .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; pointer-events: none;
                background: linear-gradient(rgba(15,23,42,.08), transparent); opacity: 0; transition: opacity var(--motion-150) var(--ease-out); }
  .bar.scrolled::after { opacity: 1; }
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(246,247,249,.92); backdrop-filter: saturate(1.4) blur(8px);
         -webkit-backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: grid; gap: 10px; padding-top: 12px; padding-bottom: 12px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  input[type=search] { width: 100%; font: inherit; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 10px;
                       background: var(--card); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: #eceef2; border-radius: 10px; padding: 3px; }
  .seg button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--ink-2);
                padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .chip { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--card); color: var(--ink-2); cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: #cbd5e1; }
  .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .toggle { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

  /* lista */
  main { padding-top: 22px; padding-bottom: 48px; }
  .group { margin: 18px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .group:first-child { margin-top: 0; }
  .list { display: grid; gap: 10px; }
  .job.enter { animation: rise var(--motion-300) var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 30ms); }
  .job.leaving { opacity: 0; transform: translateY(-6px) scale(.99); transition: opacity var(--motion-150) var(--ease-in), transform var(--motion-150) var(--ease-in); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .stat b { transition: opacity var(--motion-200) var(--ease-out); }
  .job { display: grid; grid-template-columns: 44px 1fr; gap: 14px; background: var(--card); border: 1px solid var(--line);
         border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
         transition: border-color var(--motion-150) var(--ease-out), box-shadow var(--motion-200) var(--ease-out), transform var(--motion-200) var(--ease-out); }
  @media (hover: hover) { .job:hover { transform: translateY(-1px); } }
  .job:hover { border-color: #d5dae1; box-shadow: 0 4px 12px rgba(15,23,42,.06); }
  .job.done { opacity: .55; }
  .logo { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff; }
  .top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .title { font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--ink); text-decoration: none; letter-spacing: -.005em; }
  .title:hover { color: var(--accent); }
  .meta { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .meta .dot { color: var(--ink-3); margin: 0 6px; }
  .score { flex: none; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px;
           padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { font-size: 12px; font-weight: 500; border-radius: 6px; padding: 2px 8px; background: #f1f5f9; color: var(--ink-2); }
  .tag.new { background: var(--new-soft); color: var(--new); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .acts { grid-column: 2; display: flex; gap: 8px; margin-top: -2px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: #f8fafc; }
  .btn, .chip, .seg button { transition: background-color var(--motion-150) var(--ease-out), border-color var(--motion-150) var(--ease-out),
                             color var(--motion-150) var(--ease-out), transform var(--motion-100) var(--ease-out); }
  .btn:active, .chip:active, .seg button:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.on { background: var(--new-soft); border-color: #a7f3d0; color: var(--new); }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20; display: flex; align-items: center; gap: 12px;
           background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 10px 10px 16px; font-size: 14px; box-shadow: 0 8px 24px rgba(15,23,42,.18);
           transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
           transition: transform var(--motion-150) var(--ease-in), opacity var(--motion-150) var(--ease-in); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto;
                transition: transform var(--motion-200) var(--ease-out), opacity var(--motion-200) var(--ease-out); }
  .toast button { font: inherit; font-weight: 600; color: #93c5fd; background: transparent; border: 0; padding: 0 10px; min-height: 44px; cursor: pointer; border-radius: 8px; }
  .empty { text-align: center; padding: 56px 16px; color: var(--ink-2); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  footer { color: var(--ink-3); font-size: 12px; text-align: center; padding: 0 16px 32px; }

  .app.solo { display: block; } .app.solo .side { display: none; }

  @media (max-width: 900px) {
    .app { display: block; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; gap: 12px; }
    .brand, .plabel, .side .foot { display: none; }
    .profiles { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .profiles::-webkit-scrollbar { display: none; }
    .pbtn { width: auto; flex: none; padding: 6px 12px 6px 6px; border: 1px solid var(--line); border-radius: 999px; min-height: 44px; }
    .pbtn[aria-current=true] { border-color: #bfdbfe; }
    .pbtn .ph { display: none; }
    .avatar { width: 30px; height: 30px; font-size: 12px; }
    .pcard { border: 0; padding: 0; gap: 8px; }
    .pcard h2, .pcard .ptags { display: none; }
    .wrap { padding: 0 16px; }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (pointer: coarse) {
    .btn, .chip, .seg button { min-height: 44px; }
    .seg button { padding: 6px 14px; }
    .toggle { min-height: 44px; }
    .toggle input { width: 20px; height: 20px; }
  }

  /* menos movimento: só mudanças instantâneas ou fades curtos */
  @media (prefers-reduced-motion: reduce) {
    .job.enter { animation: fade var(--motion-150) ease backwards; animation-delay: 0ms; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .job, .btn, .chip, .seg button { transition: opacity var(--motion-100) ease, background-color var(--motion-100) ease; }
    .job:hover, .btn:active, .chip:active, .seg button:active { transform: none; }
    .job.leaving { transform: none; transition: opacity var(--motion-100) ease; }
    .toast, .toast.show { transform: translate(-50%, 0); transition: opacity var(--motion-100) ease; }
  }

  @media (max-width: 560px) {
    h1 { font-size: 22px; }
    .stats { width: 100%; } .stat { flex: 1; min-width: 0; }
    .job { grid-template-columns: 36px 1fr; gap: 12px; padding: 14px; }
    .acts { grid-column: 1 / -1; gap: 6px; margin-top: 0; } .btn { padding: 7px 10px; }
    .logo { width: 36px; height: 36px; font-size: 14px; }
    .spacer { display: none; }
  }
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="Perfis">
  <div class="brand"><i aria-hidden="true">V</i>Vagas</div>
  <div>
    <div class="plabel">Perfis</div>
    <nav class="profiles" id="profiles"></nav>
  </div>
  <section class="pcard" id="pcard" aria-live="polite"></section>
  <div class="foot">
    <a id="addProfile" href="#" target="_blank" rel="noopener">+ Adicionar perfil</a>
    <span>Cada perfil recebe as suas notificações. Recolha duas vezes por dia.</span>
  </div>
</aside>
<div class="content">
<header>
  <div class="wrap head">
    <div>
      <h1 id="h1">Vagas para ti</h1>
      <div class="sub" id="sub">A carregar…</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sToday">–</b><span>Novas hoje</span></div>
      <div class="stat"><b id="sWeek">–</b><span>Últimos 7 dias</span></div>
      <div class="stat"><b id="sAll">–</b><span>No total</span></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Pesquisar título, empresa ou local" aria-label="Pesquisar vagas">
    </div>
    <div class="row">
      <div class="seg" id="days" role="group" aria-label="Período">
        <button data-d="1">Hoje</button>
        <button data-d="7" aria-pressed="true">7 dias</button>
        <button data-d="30">30 dias</button>
        <button data-d="9999">Tudo</button>
      </div>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="showDone"> Mostrar candidatadas e escondidas</label>
    </div>
    <div class="row" id="srcs" role="group" aria-label="Fonte"></div>
  </div>
</div>

<main class="wrap"><div id="list"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">Anular</button></div>
<footer>Atualiza-se sozinho duas vezes por dia. As marcações ficam guardadas só neste dispositivo.</footer>
</div>
</div>

<script>
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let profiles = [], current = "", marks = {}, all = [];
const markKey = pid => "vagas-estado:" + pid;
const save = () => store.set(markKey(current), marks);
// ligação para editar as regras no GitHub (a página está em <utilizador>.github.io/<repo>/)
const repoEdit = (() => { const u = location.hostname.split(".")[0], r = location.pathname.split("/")[1];
  return location.hostname.endsWith("github.io") && r ? `https://github.com/${u}/${r}/edit/main/config.yaml` : ""; })();

const SRC = { linkedin: "LinkedIn", indeed: "Indeed", bep: "Emprego público", remotive: "Remoto" };
const srcOf = m => SRC[(m.source || "").split(":")[0]] || "Sites de empresas";
const PALETTE = ["#2563eb", "#7c3aed", "#db2777", "#ea580c", "#059669", "#0891b2", "#4f46e5", "#be123c", "#65a30d", "#0d9488"];
const colorOf = s => { let h = 0; for (const c of s || "?") h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const initials = s => (s || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";

let data = [], updated = "", days = 7, src = "Todas", showDone = false, animateNext = true;
let toastTimer = null, undo = null;
function toast(msg, onUndo) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  undo = onUndo; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
}
document.getElementById("toastUndo").onclick = () => { if (undo) undo(); undo = null; document.getElementById("toast").classList.remove("show"); };
function viewFor(pid) {
  const first = profiles[0] && profiles[0].id;
  return all.filter(m => m.profiles ? pid in m.profiles : pid === first).map(m => {
    const pp = (m.profiles || {})[pid] || {};
    return { ...m, score: pp.score ?? m.score, flags: pp.flags ?? m.flags, fit: pp.fit ?? m.fit };
  });
}
function pidColor(p) { return colorOf(p.id + (p.name || "")); }
function renderSide() {
  const nav = document.getElementById("profiles"); nav.textContent = "";
  for (const p of profiles) {
    const ms = store.get(markKey(p.id), {});
    const fresh = viewFor(p.id).filter(m => m.first_seen === updated && !ms[m.url]).length;
    const b = el("button", "pbtn"); b.type = "button"; b.setAttribute("aria-current", p.id === current);
    const av = el("span", "avatar", initials(p.name || p.id)); av.style.background = pidColor(p); av.setAttribute("aria-hidden", "true");
    const info = el("span", "pinfo"); info.append(el("div", "pn", p.name || "O meu perfil"), el("div", "ph", p.headline || ""));
    b.append(av, info);
    if (fresh) { const c = el("span", "pcount", fresh); c.title = `${fresh} nova(s) hoje`; b.append(c); }
    b.onclick = () => select(p.id);
    nav.append(b);
  }
  const p = profiles.find(x => x.id === current) || {};
  const card = document.getElementById("pcard"); card.textContent = "";
  card.classList.remove("swap"); void card.offsetWidth; card.classList.add("swap");
  const head = el("div"); head.append(el("h2", null, p.name || "O meu perfil"), el("div", "ph", p.headline || ""));
  card.append(head);
  if ((p.tags || []).length) { const t = el("div", "ptags"); p.tags.forEach(x => t.append(el("span", null, x))); card.append(t); }
  if ((p.languages || []).length) card.append(el("div", "plang", "Línguas: " + p.languages.join(" · ")));
  const acts = el("div", "pacts");
  if (p.cv_url) { const a = el("a", "btn primary", "Ver CV"); a.href = p.cv_url; a.target = "_blank"; a.rel = "noopener"; acts.append(a); }
  if (repoEdit) { const a = el("a", "btn", "Ajustar regras"); a.href = repoEdit; a.target = "_blank"; a.rel = "noopener";
    a.title = "Abre a configuração no GitHub (secção profiles)"; acts.append(a); }
  if (acts.children.length) card.append(acts);
  const add = document.getElementById("addProfile");
  if (repoEdit) add.href = repoEdit; else add.style.display = "none";
}
function select(pid, fromHash) {
  if (!profiles.some(p => p.id === pid)) pid = profiles[0].id;
  const changed = pid !== current;
  current = pid; store.set("vagas-perfil", pid);
  if (!fromHash && location.hash.slice(1) !== pid) history.replaceState(null, "", "#" + pid);
  marks = store.get(markKey(pid), {});
  data = viewFor(pid);
  const p = profiles.find(x => x.id === pid);
  const h1 = document.getElementById("h1");
  h1.textContent = p && p.name ? `Vagas para ${p.name}` : "Vagas para ti";
  if (changed) { h1.classList.remove("swap"); void h1.offsetWidth; h1.classList.add("swap"); }
  document.title = p && p.name ? `Vagas · ${p.name}` : "Vagas";
  src = "Todas"; animateNext = true;
  renderSide(); updateStats(); buildSources(); render();
}
function updateStats() {
  const fresh = data.filter(m => !marks[m.url]);
  document.getElementById("sToday").textContent = fresh.filter(m => m.first_seen === updated).length;
  document.getElementById("sWeek").textContent = fresh.filter(m => ageDays(m.first_seen) < 7).length;
  document.getElementById("sAll").textContent = data.length;
}
const ageDays = iso => Math.round((new Date(updated + "T00:00:00") - new Date((iso || updated) + "T00:00:00")) / 864e5);
const fmtDay = iso => { const a = ageDays(iso); if (a === 0) return "Hoje"; if (a === 1) return "Ontem";
  return new Date(iso + "T00:00:00").toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" }); };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function card(m) {
  const li = el("article", "job" + (marks[m.url] ? " done" : ""));
  const logo = el("div", "logo", initials(m.company)); logo.style.background = colorOf(m.company); logo.setAttribute("aria-hidden", "true");
  const body = el("div");
  const top = el("div", "top");
  const left = el("div");
  const a = el("a", "title", m.title); a.href = m.url; a.target = "_blank"; a.rel = "noopener";
  const meta = el("div", "meta");
  [m.company, m.location].filter(Boolean).forEach((t, i) => { if (i) meta.append(el("span", "dot", "·")); meta.append(document.createTextNode(t)); });
  left.append(a, meta);
  top.append(left, el("span", "score", m.fit != null ? `Encaixe ${m.fit}` : `${m.score} pts`));
  const tags = el("div", "tags");
  if (m.first_seen === updated) tags.append(el("span", "tag new", "Nova"));
  tags.append(el("span", "tag", srcOf(m)));
  if (m.posted) tags.append(el("span", "tag", "Publicada " + (ageDays(m.posted) <= 0 ? "hoje" : `há ${ageDays(m.posted)} d`)));
  (m.flags || []).filter(f => !/sem salário indicado|não indica anos/.test(f)).slice(0, 2).forEach(f => tags.append(el("span", "tag warn", f)));
  const acts = el("div", "acts");
  const open = el("a", "btn primary", "Abrir vaga"); open.href = m.url; open.target = "_blank"; open.rel = "noopener";
  const mk = (label, val) => { const on = marks[m.url] === val; const b = el("button", "btn" + (on ? " on" : ""), on ? "✓ " + label : label);
    b.onclick = () => {
      const prev = marks[m.url];
      if (on) delete marks[m.url]; else marks[m.url] = val;
      save(); updateStats(); renderSide();
      const restore = () => { if (prev) marks[m.url] = prev; else delete marks[m.url]; save(); updateStats(); renderSide(); render(); };
      if (!on) toast(val === "aplicada" ? "Marcada como candidatada" : "Vaga escondida", restore);
      if (!on && !showDone) { li.classList.add("leaving"); setTimeout(render, 150); } else render();
    }; return b; };
  acts.append(open, mk("Candidatei-me", "aplicada"), mk("Esconder", "escondida"));
  body.append(top, tags);
  li.append(logo, body, acts);
  return li;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("list"); box.textContent = "";
  const rows = data.filter(m => ageDays(m.first_seen) < days)
    .filter(m => src === "Todas" || srcOf(m) === src)
    .filter(m => showDone || !marks[m.url])
    .filter(m => !q || [m.title, m.company, m.location].join(" ").toLowerCase().includes(q));
  if (!rows.length) {
    const e = el("div", "empty");
    const who = (profiles.find(x => x.id === current) || {}).name;
    e.append(el("b", null, data.length ? "Nada com estes filtros" : (who ? `Ainda sem vagas para ${who}` : "Ainda sem vagas")),
             document.createTextNode(data.length ? "Experimenta alargar o período ou limpar a pesquisa." : "As primeiras aparecem aqui depois da próxima recolha (≈07:15 ou 16:15)."));
    box.append(e); return;
  }
  let day = null, list = null, i = 0;
  const animate = animateNext; animateNext = false;
  for (const m of rows) {
    if (m.first_seen !== day) { day = m.first_seen; box.append(el("div", "group", fmtDay(day))); list = el("div", "list"); box.append(list); }
    const c = card(m);
    if (animate) { c.classList.add("enter"); c.style.setProperty("--i", Math.min(i++, 6)); }   // 30 ms por cartão, máx. ~200 ms
    list.append(c);
  }
}

function buildSources() {
  const box = document.getElementById("srcs"); box.textContent = "";
  const counts = {}; data.forEach(m => { counts[srcOf(m)] = (counts[srcOf(m)] || 0) + 1; });
  for (const n of ["Todas", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])]) {
    const b = el("button", "chip", n); b.setAttribute("aria-pressed", n === src);
    b.append(el("span", "n", n === "Todas" ? data.length : counts[n]));
    b.onclick = () => { src = n; buildSources(); animateNext = true; render(); };
    box.append(b);
  }
}

fetch("jobs.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  updated = d.updated;
  profiles = (d.profiles && d.profiles.length) ? d.profiles : [{ id: "eu", name: "" }];
  all = (d.matches || []).slice().sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") ||
    ((b.fit ?? b.score * 5) - (a.fit ?? a.score * 5)));
  // marcações antigas (antes dos perfis) passam para o primeiro perfil
  const legacy = store.get("vagas-estado", null);
  if (legacy && !store.get(markKey(profiles[0].id), null)) store.set(markKey(profiles[0].id), legacy);
  document.getElementById("sub").textContent = "Atualizado a " + new Date(updated + "T00:00:00").toLocaleDateString("pt-PT", { day: "numeric", month: "long" }) + " · Portugal continental";
  if (profiles.length < 2) document.querySelector(".app").classList.add("solo");
  select(location.hash.slice(1) || store.get("vagas-perfil", profiles[0].id), true);
}).catch(() => { document.getElementById("sub").textContent = "Não foi possível carregar as vagas. Tenta recarregar."; render(); });

document.querySelectorAll("#days button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#days button").forEach(x => x.setAttribute("aria-pressed", x === b)); days = +b.dataset.d; animateNext = true; render(); });
document.getElementById("showDone").onchange = e => { showDone = e.target.checked; render(); };
document.getElementById("q").addEventListener("input", render);
addEventListener("hashchange", () => profiles.length && select(location.hash.slice(1), true));
const bar = document.querySelector(".bar");
addEventListener("scroll", () => bar.classList.toggle("scrolled", scrollY > 140), { passive: true });
</script>
</body>
</html>

name: Vagas diárias

on:
  schedule:
    - cron: "17 7 * * *"       # todos os dias ~07:17 UTC (manhã em Lisboa): execução principal
    - cron: "17 16 * * *"      # ~16:17 UTC: só avisa se houver vagas novas (LinkedIn premeia quem se candidata cedo)
  workflow_dispatch: {}         # botão "Run workflow" para testar à mão

permissions:
  contents: write               # para guardar state/ e docs/ no repositório

concurrency:
  group: jobtracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: GERAL          # os segredos estão neste Environment
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes (se falharem, não corre com código partido)
        run: python -m pytest -q
      - name: Procurar vagas e avisar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          MIN_SALARY_EUR: ${{ secrets.MIN_SALARY_EUR }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # perfil da Marta (cada perfil só recebe no seu canal; sem segredo, não recebe nada)
          NTFY_TOPIC_MARTA: ${{ secrets.NTFY_TOPIC_MARTA }}
          EMAIL_TO_MARTA: ${{ secrets.EMAIL_TO_MARTA }}
          CANDIDATE_PROFILE_MARTA: ${{ secrets.CANDIDATE_PROFILE_MARTA }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m jobtracker
      - name: Guardar estado
        run: |
          git config user.name "jobtracker"
          git config user.email "jobtracker@users.noreply.github.com"
          git add state docs
          git diff --staged --quiet && exit 0
          git commit -m "estado $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1

      - "cluster manager"
      - "laboratório colaborativo"
      - "centro tecnológico"
      - "gestor de projetos europeus"
      - "european projects manager"
      - "innovation manager"
      # perfil Maria: setor público e direitos humanos
      - "public policy"
      - "políticas públicas"
      - "policy officer"
      - "administração pública"
      - "direitos humanos"
      - "human rights"
      - "proteção de crianças"
      - "child protection"
      - "igualdade de género"
      - "gender equality"
      - "refugiados"
      - "inclusão social"
      - "assuntos europeus"
      - "projetos europeus"
      - "UNICEF"
      - "EU affairs"
      - "public affairs"
      - "European projects"
      - "project officer"

  # Empresas-alvo do Pedro (lista em target_companies): uma pesquisa por empresa, só com vagas dessa empresa.
  # Em rotação: 24 empresas por recolha, por isso cada uma é vista a cada dia e meio; a janela de 7 dias
  # garante que nenhuma vaga escapa entre voltas.
  - type: linkedin
    name: "LinkedIn (empresas-alvo)"
    companies_from: target_companies
    per_run: 24
    location: Portugal
    hours: 168
    max_per_query: 25

  # Indeed Portugal (via biblioteca JobSpy). Apanha muitas vagas que não estão no LinkedIn.

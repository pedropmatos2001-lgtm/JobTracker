# --- perfis -----------------------------------------------------------------
# A recolha de vagas é feita uma vez; cada perfil avalia-as com as suas regras e recebe só as suas.
# O primeiro perfil usa as regras do topo deste ficheiro. Os outros podem substituir qualquer regra em `rules:`.
# Na página aparecem só nome, título, etiquetas e línguas. NUNCA ponhas aqui contactos, data de nascimento
# ou o CV: o repositório é público. O CV vai num endereço privado (cv_url, ex.: Google Drive só para ti).
# Notificações: cada perfil usa o seu segredo (ntfy_env / email_env). Sem segredo próprio, não recebe nada.
profiles:
  - id: pedro
    name: Pedro
    headline: "Sustentabilidade, estratégia e operações"
    tags: ["Processos e operações", "Modelo operativo", "Sustentabilidade e clima", "Ambiente e tecnologia", "Utilities", "Smart cities", "Fundos europeus"]
    languages: ["Português", "Inglês C1", "Espanhol B1"]
    cv_url: ""                       # opcional: ligação privada para o teu CV
    ntfy_env: NTFY_TOPIC
    email_env: EMAIL_TO
    profile_env: CANDIDATE_PROFILE   # só para o juiz de IA (desligado)
    admin: true                      # recebe também avisos de fontes e o "estou vivo"

  - id: maria
    name: Maria
    former_ids: [marta]              # antes chamava-se Marta: herda o que já tinha visto
    headline: "Setor público, assuntos europeus e direitos humanos"
    tags: ["Setor público", "Assuntos europeus", "Projetos europeus", "Políticas públicas", "Direitos humanos", "Inclusão e proteção"]
    languages: ["Português", "Inglês C1", "Espanhol B2"]
    cv_url: ""
    ntfy_env: NTFY_TOPIC_MARIA
    email_env: EMAIL_TO_MARIA
    profile_env: CANDIDATE_PROFILE_MARIA
    rules:
      sector_bonus: {}                            # o bónus de utilities é só do Pedro
      target_companies: []                        # as empresas-alvo também
      require_theme: true                         # só passam vagas com pelo menos um dos temas abaixo
      min_score: 4                                # com require_theme, basta um tema forte e algum contexto
      years: {min: 0, stretch_from: 4, max: 5}   # cerca de 3 anos de experiência
      senior_title: "head of|director|diretor|principal\\b|vp\\b|chief"
      senior_bonus: -3                            # cargos muito acima perdem pontos
      title_exclude:
        - "candidatura espont[âa]nea|spontaneous application"
        - "est[áa]gio curricular|curricular internship|summer intern"
        - "software|developer|devops|\\bengineer\\b|engenheir[oa]s?\\b|architect\\b|programador|full ?stack|\\bQA\\b"
        - "\\bSAP\\b|salesforce|dynamics 365|servicenow"
        - "business development|comercial|vendas|sales|customer (service|support)|apoio ao cliente|call center"
        - "motorista|driver|operador|operator|t[ée]c\\.|technician|manuten[çc][ãa]o|enfermeir|m[ée]dic[oa]\\b|professor|docente"
        - "incentivos? (fiscais|financeiros)|tax incentive|\\bSIFIDE\\b|consultor[a]? de incentivos|incentive consult|tax (consultant|advisor|manager)"
      keywords:
        strong_cap: 14
        strong:
          - {label: "Setor público", examples: ["administração pública", "ministério", "câmara municipal", "instituto público"], pattern: "setor p[úu]blico|public sector|administra[çc][ãa]o p[úu]blica|public administration|government (agency|department|body|institution)|minist[ée]rio|ministry of|c[âa]mara municipal|munic[íi]pio d|autarquia|instituto p[úu]blico|entidade p[úu]blica|\\bCCDR|assembleia da rep[úu]blica|parlamento|parliament|comiss[ãa]o europeia|european commission|council of europe|conselho da europa"}
          - {label: "Políticas públicas", examples: ["políticas públicas", "policy officer", "avaliação de políticas", "regulação"], pattern: "public polic|pol[íi]ticas p[úu]blicas|policy (analyst|officer|advisor|adviser|associate|research)|analista de pol[íi]ticas|policy evaluation|avalia[çc][ãa]o de pol[íi]ticas|policy making|policymak|think tank"}
          - {label: "Assuntos europeus", examples: ["EU affairs", "public affairs", "Parlamento Europeu", "Comissão Europeia"], pattern: "eu affairs|european affairs|assuntos europeus|public affairs|assuntos p[úu]blicos|government affairs|parlamento europeu|european parliament|comiss[ãa]o europeia|european commission|uni[ãa]o europeia|european union|\\bEU\\b institutions|institui[çc][õo]es europeias|brussels|bruxelas|\\bMEP\\b|eurodeputad"}
          - {label: "Projetos europeus e cooperação", examples: ["projetos europeus", "Erasmus+", "Interreg", "cooperação internacional"], pattern: "eu[- ]funded project|projetos? europeus?|european projects?|horizon europe|erasmus\\+?|interreg|urbact|life programme|programa life|cerv\\b|gestor[a]? de projetos? europeus?|international cooperation|coopera[çc][ãa]o internacional|cooperação para o desenvolvimento|development cooperation|international development|desenvolvimento internacional"}
          - {label: "Direitos humanos", examples: ["direitos humanos", "direitos fundamentais", "Nações Unidas", "ação humanitária"], pattern: "human rights|direitos humanos|direitos fundamentais|fundamental rights|united nations|na[çc][õo]es unidas|\\bOHCHR|amnistia|amnesty|humanitarian|humanit[áa]ri"}
          - {label: "Infância e juventude", examples: ["proteção de crianças", "juventude", "UNICEF", "CPCJ"], pattern: "child protection|children'?s rights|direitos da crian[çc]a|prote[çc][ãa]o (de|das) (crian[çc]as|menores)|crian[çc]as e jovens|crian[çc]as em risco|children and young people|safeguarding children|child welfare|\\bunicef|\\bCPCJ|inf[âa]ncia|youth (work|policy|programme|program|organi[sz]ation|participation)|pol[íi]ticas de juventude|associa[çc][ãa]o juvenil"}
          - {label: "Igualdade de género", examples: ["igualdade de género", "violência doméstica", "direitos das mulheres"], pattern: "gender equality|igualdade de g[ée]nero|gender mainstreaming|women'?s rights|direitos das mulheres|women'?s empowerment|empoderamento|viol[êe]ncia dom[ée]stica|domestic violence|gender-based violence|viol[êe]ncia de g[ée]nero|\\bCIG\\b|\\bUN Women"}
          - {label: "Inclusão e proteção", examples: ["refugiados", "migrantes", "inclusão social", "apoio a vítimas"], pattern: "refugiad|refugee|asylum|asilo|migrantes|migrants|integra[çc][ãa]o de migrantes|tr[áa]fico de seres humanos|human trafficking|exclus[ãa]o social|inclus[ãa]o social|social inclusion|pobreza|poverty|sem-abrigo|homeless|v[íi]timas de|victims of|\\bAPAV|\\bACNUR|\\bUNHCR|\\bOIM\\b|\\bAIMA\\b"}
        medium:
          - "research|investiga[çc][ãa]o|analyst|analista|project officer|gestor de projeto|project manager"
          - "stakeholder|advocacy|sensibiliza[çc][ãa]o"
          - "fundos europeus|eu funds|grant agreement|candidaturas a programas europeus"
          - "ong\\b|ngo\\b|non-profit|sem fins lucrativos|funda[çc][ãa]o"
          - "power bi|stata|excel"
        negative:
          - "commission|comiss[ãa]o de vendas|cold call|quota"
          - "call center|contact center"
          - "incentivos? (fiscais|financeiros|ao investimento)|benef[íi]cios fiscais|tax incentive|\\bSIFIDE\\b|r&d tax|cr[ée]dito fiscal|consultor[a]? de incentivos|incentive consult"

public_repo: true          # repositório público: sem matches, kits nem notas do juiz no git

# --- juiz de IA ------------------------------------------------------------
# Precisa do segredo ANTHROPIC_API_KEY. Sem ele, o tracker usa só as palavras-chave.
judge:
  enabled: false                   # desligado: o juiz usa a API paga. Sem juiz, só palavras-chave (grátis)
  model: "claude-sonnet-5-5"
  candidate_file: "candidate.example.md"   # só serve de modelo; o perfil real vem do segredo CANDIDATE_PROFILE
  min_fit: 55                      # abaixo disto não te avisa
  max_calls: 40                    # limite diário de avaliações (controla o custo)
  kit_min_fit: 70                  # a partir daqui prepara carta e pontos do CV
  max_kits: 3
radar_weekday: 4                   # sexta-feira: resumo semanal

# --- fontes ----------------------------------------------------------------
# Cada fonte falha sozinha, sem afetar as outras. Para adicionar empresas, vê o README
# (como descobrir o "token" da página de carreiras de cada uma).
sources:
  # --- Agregadores: cobrem TODAS as empresas em Portugal (não precisas de saber que existem) ---
  # LinkedIn: pesquisa pública (sem login, não usa a tua conta). Cada pesquisa traz até 50 vagas
  # publicadas nas últimas 72 h; as repetidas entre pesquisas e entre fontes contam uma vez.
  - type: linkedin
    name: LinkedIn
    location: Portugal
    hours: 72
    max_per_query: 30                # 3 páginas por pesquisa (há ~50 pesquisas: menos risco de limite)
    queries:
      - "sustainability"
      - "sustentabilidade"
      - "ESG"
      - "CSRD"
      - "AI transformation"
      - "operations excellence"
      - "melhoria contínua"
      - "process manager"
      - "business operations"
      - "utilities"
      - "energia"
      - "águas"
      - "resíduos"
      - "climate"
      - "alterações climáticas"
      - "ambiente"
      - "environmental consultant"
      - "smart cities"
      - "mobilidade"
      - "climate tech"
      - "digital transformation"
      - "transformação digital"
      - "process improvement"
      - "operational excellence"
      - "business transformation"
      - "operating model"
      - "PMO"
      - "program manager"
      - "strategy consultant"
      - "energy transition"
      - "fundos europeus"
      - "public sector consultant"
      - "associação"

# Configuração do tracker do candidato. Edita aqui; não é preciso mexer no código.

# --- fasquia -------------------------------------------------------------
# Fasquia salarial (EUR brutos/ano). Pode ser substituída pelo segredo MIN_SALARY_EUR.
# Vagas com salário PUBLICADO abaixo disto são excluídas. Vagas sem salário
# passam, mas levam o aviso "sem salário indicado" (a maioria não o publica).
min_salary_eur: 35000

min_score: 7               # pontuação mínima para avisar (com LinkedIn/Indeed há muito volume)
max_per_alert: 6           # máximo de vagas na notificação (as restantes ficam na página)
max_age_days: 14           # ignora vagas publicadas há mais tempo
max_detail_fetches: 120    # limite por execução de páginas de detalhe (o resto fica para a seguinte)
alert_after_failures: 3    # avisa se uma fonte falhar N dias seguidos
heartbeat_weekday: 0       # 0=segunda: se não houver vagas, manda "estou vivo"
click_url: "https://pedropmatos2001-lgtm.github.io/JobTracker/"   # página com todas as vagas (GitHub Pages)

years:                     # anos de experiência pedidos (extraídos do texto)
  min: 3                   # abaixo disto = provável nível júnior -> exclui
  stretch_from: 5          # a partir daqui = aviso "esticado"
  max: 6                   # acima disto -> exclui

locations:
  # só Portugal continental (Madeira e Açores excluídos de propósito)
  allow: "portugal|lisbo|porto|oeiras|amadora|alfragide|cascais|sintra|loures|braga|guimar|coimbra|set[úu]bal|aveiro|faro|leiria|santar[ée]m|[ée]vora|beja|viseu|guarda|viana|vila real|bragan|castelo branco|portalegre"
  exclude: "madeira|funchal|porto santo|a[çc]ores|azores|ponta delgada|angra do hero|horta\\b|\\bRA[AM]\\b"
  remote_ok: "portugal|europe|europa|emea|eu\\b|worldwide|anywhere|global"

title_exclude:
  - "candidatura espont[âa]nea|spontaneous application"
  - "intern\\b|internship|est[áa]gi|trainee|junior|júnior|graduate"
  - "software engineer|developer|devops|data engineer|ml engineer|engenheiro de software|sre\\b"
  # perfis técnicos / de TI (o teu perfil é transformação, processos, ESG, PMO, fundos):
  - "\\bengineer\\b|engenheir[oa]s?\\b|architect\\b|arquitet[oa]\\b|scientist|full ?stack|back-?end|front-?end|\\bQA\\b|tester|tech lead|programador|site reliability|infrastructure|infraestrutura"
  - "\\bSAP\\b|dynamics 365|salesforce|servicenow|power platform|successfactors"
  - "product (manager|owner|ops|development)|product management"
  - "\\btax\\b|payroll|auditor|controller|accountant|contabil|insurance broker|actuar"
  - "account manager|business development|comercial|customer (service|support)|apoio ao cliente|speaker"
  - "t[ée]c\\.|t[ée]cnico (de|superior de manuten)|technician|manuten[çc][ãa]o|operador|operator"
  - "sales|vendas|account executive|recruiter|driver|motorista|assistente|t[ée]cnico de"

senior_title: "senior|sénior|manager|lead|head|principal|director|diretor|dirigente|chefe de (divis|equipa|projeto)"
senior_bonus: 2

keywords:
  strong_cap: 14
  strong:                  # +3 cada (+2 se estiver no título)
    # foco: negócio e operações — processos, organização, modelo operativo
    - {label: "Processos e melhoria contínua", examples: ["melhoria contínua", "lean", "BPMN", "process excellence"], pattern: "process (re-?)?engineering|reengenharia|process (excellence|improvement|optimi[sz]ation|manager|owner)|operational excellence|excel[êe]ncia operacional|melhoria (cont[íi]nua|de processos)|otimiza[çc][ãa]o de processos|\\blean\\b|six sigma|bpmn?\\b"}
    - {label: "Modelo operativo e organização", examples: ["modelo operativo", "desenho organizacional", "reestruturação", "change management"], pattern: "operating model|modelo operativo|target operating|organi[sz]ational (design|effectiveness|transformation|development)|desenho organizacional|reestrutura[çc][ãa]o|reorganiza|business transformation|transforma[çc][ãa]o (organizacional|do neg[óo]cio)|change management|gest[ãa]o da mudan[çc]a"}
    - {label: "Gestão de operações", examples: ["operations manager", "business operations", "eficiência operacional", "gestão de ativos"], pattern: "operations (manager|management|excellence|lead|analyst|consultant|director)|business operations|gest[ãa]o de opera[çc][õo]es|efici[êe]ncia operacional|operational (efficiency|performance|planning)|asset management|gest[ãa]o de ativos"}
    # setor: sustentabilidade, ambiente e clima
    - {label: "Sustentabilidade e ESG", examples: ["ESG", "CSRD", "descarbonização", "economia circular"], pattern: "csrd|esg|\\bgri\\b|tcfd|ghg|sustainab|sustentabilidade|decarboni[sz]|descarboniza|circular economy|economia circular|net[- ]zero|carbon|carbono"}
    - {label: "Clima e ambiente", examples: ["alterações climáticas", "ambiente", "emissões", "biodiversidade"], pattern: "climate|clim[áa]tic|altera[çc][õo]es clim[áa]ticas|a[çc][ãa]o clim[áa]tica|environment(al)?\\b|ambient(e|al)\\b|biodivers|emiss(ions|[õo]es)|iso 14001|\\blca\\b|life cycle assessment"}
    # ambiente + tecnologia, smart cities e mobilidade
    - {label: "Smart cities e mobilidade", examples: ["smart cities", "mobilidade", "transporte público", "GIS"], pattern: "smart cit|cidades? inteligentes?|urban (mobility|planning|analytics)|mobilidade|e-?mobility|transporte p[úu]blico|ferrovi|cleantech|climate tech|greentech|environmental (data|technology)|\\bgis\\b|geospatial|georreferenc"}
    - {label: "Utilities: energia, água e resíduos", examples: ["utilities", "transição energética", "água e saneamento", "resíduos"], pattern: "utilit|energy transition|transi[çc][ãa]o energ[ée]tica|renewable|renov[áa]vel|electricity|eletricidade|power grid|rede el[ée]trica|distribui[çc][ãa]o de (energia|[áa]gua)|\\bwater\\b|[áa]guas?\\b|saneamento|wastewater|waste management|res[íi]duos"}
    - {label: "PMO e programas", examples: ["PMO", "program manager", "transformation office"], pattern: "pmo|program(me)? manage|transformation (manager|lead|office)"}
    - {label: "Fundos europeus", examples: ["fundos europeus", "PRR", "Portugal 2030", "Horizon Europe"], pattern: "eu funds|fundos europeus|fundos comunit|horizon europe|portugal 2030|\\bPRR\\b|plano de recupera|funding application|candidaturas? a (fundos|financiamento|programas|projetos)"}
    - {label: "CCDR e modernização administrativa", examples: ["CCDR", "desenvolvimento regional", "modernização administrativa"], pattern: "\\bCCDR|comiss[ãa]o de coordena[çc][ãa]o e desenvolvimento regional|desenvolvimento regional|moderniza[çc][ãa]o administrativa|planeamento estrat[ée]gico"}
  medium:                  # +1 cada (tecnologia e IA contam, mas como complemento)
    - "\\bAI\\b|artificial intelligence|intelig[êe]ncia artificial|genai|generative ai|ia generativa"
    - "digital transformation|transforma[çc][ãa]o digital|automation|automatiza"
    - "strategy|estrat[ée]gia"
    - "kpi|performance management|indicadores|power bi"
    - "stakeholder"
    - "public sector|setor p[úu]blico|government|munic[íi]pi|c[âa]mara municipal|autarquia"
  negative:                # -3 cada
    - "commission|comiss[ãa]o|cold call|quota"
    - "call center|contact center"

# Empresas e setores que preferes (utilities, energia, água, resíduos): +4 pelo nome da empresa ou título.
sector_bonus:
  points: 4
  pattern: "\\bEDP\\b|E-REDES|\\bGalp\\b|\\bREN\\b|Redes Energ[ée]ticas|Iberdrola|Endesa|Engie|Greenvolt|Lightsource|Hyperion|Voltalia|Ørsted|Orsted|[ÁA]guas de Portugal|\\bAdP\\b|\\bEPAL\\b|[ÁA]guas do|Indaqua|\\bBe Water|\\bLIPOR\\b|Valorsul|\\bEGF\\b|\\bSUMA\\b|Ambiente|\\bERSAR\\b|\\bERSE\\b|\\bADENE\\b|Floene|Goldenergy|Tejo Energia|utilit|\\benerg"


# Configuração do tracker do candidato. Edita aqui; não é preciso mexer no código.

# --- fasquia -------------------------------------------------------------
# Fasquia salarial (EUR brutos/ano). Pode ser substituída pelo segredo MIN_SALARY_EUR.
# Vagas com salário PUBLICADO abaixo disto são excluídas. Vagas sem salário
# passam, mas levam o aviso "sem salário indicado" (a maioria não o publica).
min_salary_eur: 30000          # Pedro: só muda por pelo menos 30 000 € brutos por ano (conta quando a vaga publica o salário)
# Empresas que nunca interessam ao Pedro: já trabalha na Deloitte (GPS), e mudar para outra Big4 não é subir.
company_exclude: "\\bDeloitte\\b|\\bEY\\b|Ernst ?(&|and) ?Young|\\bPwC\\b|PricewaterhouseCoopers|\\bKPMG\\b|\\bStrategy ?&|hospitality|hotel|hot[ée]is|hoteleir|pousadas?\\b|resort"
company_exclude_label: "Deloitte, EY, PwC (incl. Strategy&), KPMG e hotelaria"

min_score: 5               # pontuação mínima (um tema forte no título ou dois temas no texto chegam)
require_theme: true        # sem nenhum tema forte não passa (bónus de empresa + "manager" já não chegam)
theme_focus: true          # e o tema tem de estar no título, ou haver dois temas (uma menção solta a "sustentabilidade" não chega)
max_per_alert: 6           # máximo de vagas na notificação (as restantes ficam na página)
max_age_days: 30           # ignora vagas publicadas há mais tempo (muitas ficam abertas um mês)
max_detail_fetches: 300    # limite por execução de páginas de detalhe (o resto fica para a seguinte)
alert_after_failures: 3    # avisa se uma fonte falhar N dias seguidos
heartbeat_weekday: 0       # 0=segunda: se não houver vagas, manda "estou vivo"
click_url: "https://pedropmatos2001-lgtm.github.io/JobTracker/"   # página com todas as vagas (GitHub Pages)

years:                     # anos de experiência pedidos (extraídos do texto)
  min: 2                   # abaixo disto = provável nível júnior -> exclui
  stretch_from: 5          # a partir daqui = aviso "esticado"
  max: 6                   # acima disto -> exclui

locations:
  # só Portugal continental (Madeira e Açores excluídos de propósito)
  allow: "portugal|lisbo|porto(?!\\s*alegre)|oeiras|amadora|alfragide|cascais|sintra|loures|braga|guimar|coimbra|set[úu]bal|aveiro|faro|leiria|santar[ée]m|[ée]vora|beja|viseu|guarda|viana|vila real|bragan|castelo branco|portalegre"
  exclude: "madeira|funchal|porto santo|a[çc]ores|azores|ponta delgada|angra do hero|horta\\b|\\bRA[AM]\\b"
  remote_ok: "portugal|europe|europa|emea|eu\\b|worldwide|anywhere|global"

title_exclude:

      - "projetos europeus"
      - "gestor de inovação"
      - "ambiente"
      - "alterações climáticas"
      - "smart cities"
      - "mobilidade"
      # perfil Maria: setor público e direitos humanos
      - "políticas públicas"
      - "administração pública"
      - "direitos humanos"
      - "proteção de crianças"
      - "igualdade de género"
      - "inclusão social"
      - "assuntos europeus"

  # --- Setor público: Bolsa de Emprego Público (governo central, CCDR, institutos, câmaras) ---
  # Lê cada oferta nova pelo número sequencial. start_id só serve na 1.ª execução; depois o
  # último número visto fica em state.json. Madeira e Açores são excluídos automaticamente.
  - type: bep
    name: BEP (emprego público)
    start_id: 156850                 # ≈ ofertas publicadas a partir de ~12 nov. 2026
    careers: "t[ée]cnico superior|dirigente|dire[çc][ãa]o|chefe|especialista|inspe[ct]tor|consultor|cargos n[ãa]o inseridos"
    # Mobilidade e concursos internos são só para quem já tem vínculo à função pública.
    # Se um dia tiveres vínculo, apaga esta linha.
    exclude_types: "mobilidade|concurso interno|regulariza"
    min_score: 3                     # basta 1 tema forte (CCDR, fundos europeus, sustentabilidade, transformação digital…)

  # --- Empresas específicas (feeds próprios; apanham vagas que às vezes não vão para o LinkedIn) ---
  - type: workable
    name: Greenvolt
    account: greenvolt            # visto em apply.workable.com/greenvolt/...

  - type: greenhouse
    name: Systemiq
    token: systemiq               # visto em job-boards.eu.greenhouse.io/systemiq/...

  # Adzuna desligada: a API não cobre Portugal (só gb, us, de, fr, nl, es, it, at, be, br, ca, au, in, mx, nz, pl, sg, za),
  # por isso o código "pt" dá 404. O adaptador fica no código caso passe a cobrir.

  - type: remotive                # remoto (sem chave)
    name: Remotive
    search: ["sustainability", "ESG", "AI transformation", "operations manager", "strategy"]

  # Páginas sem API: avisa de ligações novas que batam no padrão.
  # Menos fiável (se a página for dinâmica, o tracker avisa que devolveu 0 ligações).
  # EU Careers desligada: o endereço antigo dava 404 e a lista não separa Lisboa de Bruxelas, por isso
  # as vagas viriam com o local errado. As agências de Lisboa (EMSA, EUDA) são cobertas pela tarefa diária.

  # --- Empresas do Norte (ambiente / energia / água / resíduos), verificadas em nov. 2026 ---
  # EDP: portal próprio com pesquisa por localização (padrão de URL confirmado).
  - type: page_watch
    name: EDP (Porto)
    url: "https://jobs.edp.com/search/?q=&locationsearch=Porto&locale=pt_PT"
    link_regex: "."
    url_regex: "/job/"
    location: "Porto"

  - type: page_watch
    name: EDP (Lisboa)
    url: "https://jobs.edp.com/search/?q=&locationsearch=Lisboa&locale=pt_PT"
    link_regex: "."
    url_regex: "/job/"
    location: "Lisboa"

  # Lightsource bp (renováveis, Lisboa): mesmo portal SuccessFactors da EDP (/job/Local-Titulo/ID/).
  # Confirmado em 15 nov. 2026: a pesquisa lista 2 vagas em Lisboa com ligações /job/.
  - type: page_watch
    name: Lightsource bp (Lisboa)
    url: "https://careers.lightsourcebp.com/search/?q=&locationsearch=Lisbon"
    link_regex: "."
    url_regex: "/job/"
    location: "Lisboa"

  # Galp: portal jobs.galp.com (mesmo modelo da EDP; vagas em /job/Local-Titulo/ID/). Confirmado em 15 nov. 2026.
  # Galp desligada: o portal carrega as vagas por JavaScript (0 ligações). As vagas da Galp chegam pelo LinkedIn.
  - type: page_watch
    enabled: false
    name: Galp (Lisboa)
    url: "https://jobs.galp.com/search/?createNewAlert=false&q=&locationsearch=Lisboa"
    link_regex: "."
    url_regex: "/job/"
    location: "Lisboa"

  - type: page_watch
    enabled: false
    name: Galp (Porto)
    url: "https://jobs.galp.com/search/?createNewAlert=false&q=&locationsearch=Porto"
    link_regex: "."
    url_regex: "/job/"
    location: "Porto"

  # Porto Ambiente: lista as vagas em PDF na página de recrutamento (confirmado).
  - type: page_watch
    name: Porto Ambiente
    url: "https://www.portoambiente.pt/recrutamento"
    link_regex: "t[ée]cnic|jurista|engenheir|gestor|analista|diretor|coordenador|especialista"
    location: "Porto"

  # LIPOR desligada: a página dá 404 a partir do GitHub (provável bloqueio ou mudança de endereço).
  # Os procedimentos concursais saem também na Bolsa de Emprego Público (BEP).

  # Sem lista pública de vagas (só candidatura espontânea / LinkedIn): Quadrante, Indaqua, Águas do Douro e Paiva
  # e restante grupo AdP (publica no LinkedIn). Ficam cobertas pela pesquisa diária da tarefa Claude.
